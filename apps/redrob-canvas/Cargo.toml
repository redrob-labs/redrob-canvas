[package]
name = "redrob-canvas"
description = "Redrob Canvas: photo, vector and layout editing with an agent in one window"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "redrob-canvas"
path = "src/main.rs"

[dependencies]
# The union of the eframe features the three upstream desktop binaries enable.
eframe = { workspace = true, features = ["wgpu", "accesskit", "wayland", "x11", "persistence", "default_fonts"] }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# The system language on first run (Windows has no LANG): the Photo editor pins the same version.
sys-locale = "=0.3.2"
redrob-ai = { path = "../../crates/redrob-ai" }
redrob-photo-ui-egui = { workspace = true }
redrob-photo-engine = { workspace = true }
redrob-photo-io = { workspace = true }
redrob-photo-format = { workspace = true }
redrob-photo-codecs = { workspace = true }
redrob-photo-doc = { workspace = true }
redrob-photo-color = { workspace = true }
redrob-photo-compose = { workspace = true }
redrob-photo-geom = { workspace = true }
redrob-photo-raster = { workspace = true }
redrob-vector-ui-egui = { workspace = true }
redrob-vector-engine = { workspace = true }
redrob-vector-format = { workspace = true }
redrob-vector-text = { workspace = true }
redrob-vector-doc = { workspace = true }
redrob-vector-geom = { workspace = true }
redrob-vector-render = { workspace = true }
redrob-vector-svg = { workspace = true }
redrob-layout-ui-egui = { workspace = true }
redrob-layout-engine = { workspace = true }
redrob-layout-geom = { workspace = true }
redrob-layout-images = { workspace = true }
redrob-layout-render = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
webbrowser = { workspace = true }
# The in-app update check (src/update.rs): GitHub's releases API over the async client the
# workspace already has, on a current-thread runtime; the download is checked against SHA256SUMS.txt.
reqwest = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }

[lints]
workspace = true
