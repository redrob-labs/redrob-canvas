# Build with: trunk build --release   (from apps/redrob-canvas-web; release.yml's `web` job)
# `dist/` sits under this crate so the workflow zips one directory as redrob-canvas-web-<version>.zip.
[build]
target = "index.html"
dist = "dist"
public_url = "./"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8766
