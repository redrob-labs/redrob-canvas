[package]
name = "redrob-photo-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
redrob-photo-geom = { workspace = true }
redrob-photo-color = { workspace = true }
redrob-photo-cms = { workspace = true }
redrob-photo-raster = { workspace = true }
redrob-photo-doc = { workspace = true }
redrob-photo-ops = { workspace = true }
redrob-photo-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
redrob-photo-paint = { workspace = true }
redrob-photo-algo = { workspace = true }
redrob-photo-text = { workspace = true }
redrob-photo-vector = { workspace = true }
redrob-photo-io = { workspace = true }
redrob-photo-psd = { workspace = true }
redrob-photo-format = { workspace = true }
redrob-photo-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
redrob-photo-codecs = { workspace = true }
flate2 = { workspace = true }
redrob-craft-print = { workspace = true }

# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through redrob-photo-ui-egui and usvg.
roxmltree = "0.20"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
redrob-photo-affinity = { workspace = true, features = ["synth"] }
# Synthetic camera raw files for the open tests.
redrob-photo-raw = { workspace = true, features = ["testgen"] }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
exr = { version = "1.73", default-features = false }
