[package]
name = "photocraft-cli"
description = "Headless Photocraft: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional redrob-photo-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["redrob-photo-codecs/heif"]

[lints]
workspace = true

[lib]
name = "photocraft_cli"
path = "src/lib.rs"

[[bin]]
name = "photocraft-cli"
path = "src/main.rs"

[dependencies]
redrob-photo-automation = { path = "../../crates/automation" }
redrob-photo-engine = { workspace = true }
redrob-photo-io = { workspace = true }
redrob-photo-format = { path = "../../crates/format" }
redrob-photo-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for photocraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

