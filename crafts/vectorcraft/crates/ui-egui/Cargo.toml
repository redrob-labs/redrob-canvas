[package]
name = "redrob-vector-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorCraft egui frontend (menus, panels, tools and canvas); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
redrob-craft-ui = { workspace = true }
redrob-vector-geom = { workspace = true }
redrob-vector-color = { workspace = true }
redrob-vector-doc = { workspace = true }
redrob-vector-brush = { workspace = true }
redrob-vector-render = { workspace = true }
redrob-vector-text = { workspace = true }
redrob-vector-tools = { workspace = true }
redrob-vector-engine = { workspace = true }
redrob-vector-svg = { workspace = true }
redrob-vector-effects = { workspace = true }
redrob-vector-three-d = { workspace = true }
redrob-vector-plugins = { workspace = true }
redrob-vector-pdf = { workspace = true }
redrob-vector-cad = { workspace = true }
redrob-vector-eps = { workspace = true }
redrob-vector-format = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `now_ms` (src/lib.rs) reads the page's `performance.now()` with this crate in the web build. It is
# MIT OR Apache-2.0 and already in the build through eframe.
web-time = "1"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
redrob-vector-testkit = { workspace = true }
wat = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
