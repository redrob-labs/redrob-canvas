[package]
name = "redrob-layout-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layout renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
redrob-layout-geom = { workspace = true }
redrob-layout-color = { workspace = true }
redrob-layout-doc = { workspace = true }
redrob-layout-fonts = { workspace = true }
redrob-layout-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
hayro = { workspace = true }
redrob-layout-images = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
