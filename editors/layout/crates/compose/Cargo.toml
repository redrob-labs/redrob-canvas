[package]
name = "redrob-layout-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layout text composition: paragraph composer (Knuth–Plass), hyphenation, justification, columns, threading, wrap"

[lints]
workspace = true

[dependencies]
unicode-bidi = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
redrob-layout-geom = { workspace = true }
redrob-layout-color = { workspace = true }
redrob-layout-doc = { workspace = true }
redrob-layout-fonts = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
miniz_oxide = "0.8"
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "portuguese", "spanish", "norwegian"] }

[dev-dependencies]
redrob-layout-fonts = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
