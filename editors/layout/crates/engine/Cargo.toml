[package]
name = "redrob-layout-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignCraft engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
redrob-canvas-print = { workspace = true }
redrob-layout-images = { workspace = true }
redrob-layout-geom = { workspace = true }
redrob-layout-color = { workspace = true }
redrob-layout-doc = { workspace = true }
redrob-layout-fonts = { workspace = true }
redrob-layout-compose = { workspace = true }
redrob-layout-render = { workspace = true }
redrob-layout-format = { workspace = true }
redrob-layout-epub = { workspace = true }
redrob-layout-pptx = { workspace = true }
redrob-layout-textimport = { workspace = true }
redrob-layout-pdf = { workspace = true }
redrob-layout-tools = { workspace = true }
redrob-layout-idml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[dev-dependencies]
redrob-layout-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
