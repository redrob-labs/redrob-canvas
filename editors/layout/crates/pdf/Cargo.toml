[package]
name = "redrob-layout-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layout PDF export (krilla): real text with embedded font subsets, CMYK/spot colour, bleed and printer's marks"

[lints]
workspace = true

[dependencies]
redrob-layout-geom = { workspace = true }
redrob-layout-color = { workspace = true }
redrob-layout-doc = { workspace = true }
redrob-layout-fonts = { workspace = true }
redrob-layout-compose = { workspace = true }
redrob-canvas-pdf = { workspace = true, features = ["write-pdf"] }
krilla-svg = { workspace = true }
redrob-layout-images = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# The placed-PDF version check names hayro's PdfVersion (krilla::pdf::Pdf::version returns it).
hayro-syntax = "0.7.2"

[dev-dependencies]
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }
tiff = { workspace = true }
redrob-layout-fonts = { workspace = true, features = ["testing"] }
