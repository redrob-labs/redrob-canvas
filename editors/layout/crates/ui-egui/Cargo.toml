[package]
name = "redrob-layout-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DesignCraft egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
redrob-canvas-ui = { workspace = true }
redrob-layout-geom = { workspace = true }
redrob-layout-color = { workspace = true }
redrob-layout-doc = { workspace = true }
redrob-layout-fonts = { workspace = true }
redrob-layout-compose = { workspace = true }
redrob-layout-render = { workspace = true }
redrob-layout-tools = { workspace = true }
redrob-layout-engine = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-segmentation = { workspace = true }
regex = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
redrob-layout-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
redrob-layout-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
