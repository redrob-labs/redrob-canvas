[package]
name = "redrob-vector-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorCraft Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
redrob-vector-geom = { workspace = true }
redrob-vector-color = { workspace = true }
redrob-vector-doc = { workspace = true }
redrob-vector-effects = { workspace = true }
redrob-vector-brush = { workspace = true }
redrob-vector-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
redrob-vector-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
redrob-vector-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
redrob-vector-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
# Live effects' params, as the art styles that name them give them.
serde_json = { workspace = true }

[dev-dependencies]
redrob-vector-testkit = { workspace = true }
