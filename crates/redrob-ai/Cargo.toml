[package]
name = "redrob-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "AI tools shared by every Redrob Canvas mode: the local IOPaint engine, image trace, and the mode agent"

[lints]
workspace = true

[features]
default = ["engine"]
# The IOPaint engine, its HTTP client and the mode agent: tokio, reqwest and the Redrob Code client.
# Off, the crate is the pixel types and Image Trace only, which is what builds for wasm32 (the web
# shell shows "AI tools need the desktop app"); tokio with the workspace's features refuses wasm.
engine = ["dep:async-trait", "dep:redrob-agent", "dep:reqwest", "dep:tokio"]

[dependencies]
async-trait = { workspace = true, optional = true }
base64.workspace = true
image.workspace = true
redrob-agent = { path = "../redrob-agent", optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
vectorcraft-trace.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
