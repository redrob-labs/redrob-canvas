<!doctype html>
<!--
  Background of the Redrob Canvas disk image window (660x400). Rendered to res/background.png (1x) and
  res/background@2x.png by installer/macos/render-background.sh; not loaded at run time.

  Light ground, not the Windows setup's deep one: Finder draws the icon labels itself, in dark type
  outside Dark Mode, and a black field would swallow them. Design system: ground `canvas` white, ink
  gray-9, the foot light is `wash-edge` from the brand gradient (blue-6 -> accent-teal-3) at low
  strength, Pretendard when installed (falls back to the system face).

  Finder places the icons: the app at (170, 180), Applications at (490, 180), the uninstaller at
  (250, 318) and the Licenses folder at (410, 318), icons 96pt, all centres in window points (dmg_settings.py).
  The arrow sits between the first two.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .window {
    width: 660px; height: 400px; position: relative; overflow: hidden;
    background: #FFFFFF;
    font-family: "Pretendard", "SF Pro Text", -apple-system, "Helvetica Neue", sans-serif;
    color: #16181D;
  }
  .wash {
    position: absolute; left: -10%; right: -10%; bottom: -120px; height: 260px;
    background: radial-gradient(60% 100% at 50% 100%,
      rgba(43, 82, 255, 0.16) 0%, rgba(111, 244, 240, 0.10) 40%, rgba(255, 255, 255, 0) 75%);
    filter: blur(24px);
  }
  /* The product lockup (resources/brand/, tools/build_lockup.py), 30px tall: above the 18px minimum
     (10-logo.md), Primary on a light ground. */
  .lockup {
    position: absolute; top: 38px; left: 50%; height: 30px; transform: translateX(-50%);
  }
  .sub {
    position: absolute; top: 82px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: #6B7280;
  }
  .arrow { position: absolute; left: 262px; top: 164px; width: 136px; height: 32px; }
</style>
</head>
<body>
  <div class="window">
    <div class="wash"></div>
    <img class="lockup" src="../../../resources/brand/redrob-canvas-lockup.png" alt="Redrob Canvas">
    <div class="sub">Drag the app onto Applications to install it.</div>
    <svg class="arrow" viewBox="0 0 136 32" fill="none" stroke="#2B52FF" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 16H124"/><path d="M110 4L126 16L110 28"/>
    </svg>
  </div>
</body>
</html>
