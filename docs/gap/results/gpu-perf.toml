# Stage 3 Part 1 -- Redrob Canvas 0.8.1 GPU performance on gui-box-gpu (NVIDIA L40S).
# Generated 2026-10-16 from ~/canvas-gap/logs/{run.log,trace-*.log,smi-*.log} on the GPU host
# (copied to results/gpu/run.log). All numbers are wall-clock ms measured outside the app except
# where the source says "app trace" (the app's own REDROB_CANVAS_TRACE / REDROB_PHOTO_STROKE_TRACE
# stderr hooks, found by grepping the binary for env names and confirmed in apps/redrob-canvas/src/
# trace.rs and crafts/photocraft/crates/ui-egui/src/stroke_trace.rs).

[host]
name = "gui-box-gpu"
gpu = "NVIDIA L40S 46068 MiB, driver 595.91.07"
cpu_cores = 8
ram_gb = 61
display = "real X session: Xdcv (NICE DCV) :0 + xfwm4, resized with xrandr from 800x600 to 1600x1000; no Xvfb used"
app = "redrob-canvas-0.8.1-linux-x86_64.tar.gz (sha256 in tools/SHA256SUMS.txt), extracted to ~/canvas-gap/app"
env = "WGPU_BACKEND=vulkan REDROB_CANVAS_TRACE=1 REDROB_PHOTO_STROKE_TRACE=1 REDROB_CANVAS_NO_UPDATE_CHECK=1 REDROB_CANVAS_CONFIG_DIR=~/canvas-gap/cfg LD_LIBRARY_PATH=~/canvas-gap/sysroot/usr/lib/x86_64-linux-gnu"
gpu_confirmed = "nvidia-smi lists app/bin/redrob-canvas as a C+G process (216 MiB idle, up to 3649 MiB with the 8K 10-layer document); the app's stroke trace reports 'vulkan NVIDIA L40S'"
missing_lib = "libxkbcommon-x11.so.0 is not installed on the host and the binary dlopens it (xkbcommon-dl panic at start); fixed for the test by extracting libxkbcommon-x11-0_1.6.0-1build1_amd64.deb into a private sysroot. A Linux user without libxkbcommon-x11 gets an abort on launch -- gap item"
photo_prefs = "performance.useGpu=true (default), gpuBackend=auto, lowResolutionPreviews=true, memoryUsageMb=8192; dialogs.filter.blur.gaussianBlur.radius=20 pre-set so the remembered dialog default is a real blur"

[method]
start = "time from exec to the window appearing (xdotool search) and to the first UI frame (app trace 'shell set up the context')"
open = "Ctrl+O -> xdg-desktop-portal GTK file chooser -> Ctrl+L path Return; ms from Return until the window title becomes '<file> - Redrob Canvas' (the shell sets it the frame the document becomes active; the Photo editor's own '<file> — Redrob Canvas' title appears the same frame). Polled every 20 ms"
ops = "Ctrl+F command palette -> type the command -> Return opens its dialog (1.5 s settle, live preview on a reduced copy per lowResolutionPreviews) -> Return commits; ms from the commit Return until the title gains '*' (document dirty = command committed, full-resolution). Auto Tone / Auto Contrast have no dialog: ms from the palette Return. Each op runs in a fresh app instance on a clean document"
fps = "app stroke trace: a 150-point xdotool brush stroke (B tool) across the canvas; per-frame interval p50/p95 while the stroke is live -> fps = 1000/interval_p50. The first stroke after selecting the tool is never traced, so two strokes were drawn per state and the traced one(s) reported"
composite = "10 layers = the opened photo + 9x Layer via Copy (Ctrl+J); confirmed by GPU memory: +768 MiB at 4K (= 9 x 5760x3840x4 B) and +2304 MiB at 8K (= 9 x 8900x6675x4 B)"
vram = "nvidia-smi --query-compute-apps used_memory sampled every 0.5 s during the run; peak per op"
screenshots = "import -window <app window> before/after each op; compared with ImageMagick compare -metric AE + trim bbox, never viewed"

[start]
window_ms = [48, 51, 52, 50, 50, 50, 53, 48, 53, 50, 52, 48, 52, 48, 49]
first_frame_ms_app_trace = [257, 268, 265, 274]
first_frame_ms_standalone_trace_runs = [434, 434, 430]
first_frame_ms_cold_first_launch = 1391
note = "warm start = ~0.26-0.43 s to the first frame on the L40S; the very first launch after extraction (cold page cache) took 1.39 s"

