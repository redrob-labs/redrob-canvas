[fps_note]
text = "The 'wait' stage (interval minus CPU time, ~2.4 ms p50 in every run) is the swap-chain wait on the Xdcv display, which has no real vsync; the app is not GPU-bound at either size: canvas composite+upload is 0.45-1.6 ms p50 and the 10-layer composite adds only ~0.3 ms at 4K and ~0.9 ms at 8K. Blur/levels/curves are one-shot commands; the app has no frame-time hook that covers them, so they are reported as commit wall ms above."

[cpu_host_comparison]
status = "not measured"
reason = "the CPU-only host's main display :0 was occupied for the whole run by another session's Canvas instance (pid 932284, 'portrait-4k.jpg* - Redrob Canvas', Stage 2 verification). Launching a second instance on :0 would have stolen its focus and broken that session's xdotool-driven checks, and the steering forbids a local Xvfb. Re-run tools/gpu/run_part1.sh locally (DISPLAY=:0, no WGPU_BACKEND) once :0 is free to fill this section."
host = "Intel Xeon Platinum 8488C, 32 vCPU, 123 GB RAM, no GPU (Vulkan ICDs: lvp/lavapipe software only), display :0 1920x1080"
