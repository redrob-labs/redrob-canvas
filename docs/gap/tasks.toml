# Stage 1-A: 핵심 작업 50개 (Redrob Canvas vs Photoshop / GIMP 3 / Krita 5)
# 영역 배분: brush 6, selection 6, transform 4, layer 5, mask 3, adjust 5,
#            filter 5, text 3, psd 5, export 3, vector 2, layout 1, ai 2 = 50
# canvas_entry 는 코드에 해당 명령/메뉴 문자열이 grep 으로 확인된 자리다.
# 코드가 있다는 뜻일 뿐, 동작 판정은 Stage 2 가 한다. 못 찾으면 "unknown".
# 경로 접두: E = editors/photo/crates/engine/src, U = editors/photo/crates/ui-egui/src

# ---------------------------------------------------------------- brush (6)

[[task]]
id = "BR-01"
area = "brush"
title = "기본 원형 브러시로 필압 스트로크 긋기"
input = "photo/product-1k.png"
steps = [
  "파일을 열고 새 빈 레이어를 추가한다",
  "브러시 도구(B), 크기 40px, 경도 50%, 불투명도 100%로 설정한다",
  "태블릿(없으면 마우스)으로 좌상단에서 우하단까지 S자 스트로크 1회",
  "필압이 있으면 스트로크 폭이 압력에 따라 변하는지 확인한다",
]
pass = "새 레이어의 비투명 픽셀이 1,000개 이상 생기고, 스트로크 시작~끝 그리기 지연이 100ms 미만(화면 갱신 시각 기준)이다."
