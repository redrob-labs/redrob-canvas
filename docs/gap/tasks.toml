ps = "Brush Tool(B), Options bar에서 Size/Hardness/Opacity, Pressure for Size 토글."
canvas_entry = "paint.stroke / paint.brush (E/brush_cmds.rs, E/paint_cmds.rs; 필압 crates/tablet/src/x11.rs)"
mode = "photo"
timed = true

