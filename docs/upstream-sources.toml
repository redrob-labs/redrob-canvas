[redrob_code]
repository = "https://github.com/redrob-labs/redrob-code"
# A release tag and the commit it points at, rather than a bare commit. The engine once deleted
# every tag when it reset its version line, and a commit reachable only from a deleted ref did not
# survive; a tag a published release points at cannot go the same way while the release exists.
# Both halves are CHECKED to agree (scripts/verify-upstream.sh step 3): a tag is a movable ref, so
# recording it is not the same as pinning it. The same tag is what Cargo.toml's
# redrob-engine-client dependency names, and the script checks that too.
tag = "v0.6.4"
commit = "bcb8af0dc6f3b97c95208259da4c6a993e4935d9"
kind = "protocol"
role = ["Redrob Code shared daemon", "OpenAI-compatible chat completions", "streaming tool calls", "sign-in state"]
