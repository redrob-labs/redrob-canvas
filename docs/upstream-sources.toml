# Pinned upstream sources. Update only with a compatibility review, and only here: no commit hash
# in this file is duplicated anywhere except upstream-base.json, which scripts/verify-upstream.sh
# checks agrees with this one.
#
# `kind` is the load-bearing field, and scripts/verify-upstream.sh checks it:
#
#   code       Source code is VENDORED into this repository as a git subtree under crafts/<name>.
#              The upstream licence therefore binds our distribution and must be compatible with
#              MIT OR Apache-2.0 in the inbound direction. Every such source needs an attribution
#              section in UPSTREAM_NOTICES.md recording its pinned commit, and the subtree's squash
#              commit ("Squashed 'crafts/<name>/' content from commit <sha>") must name that commit.
#   protocol   A wire format or API we speak. Nothing is copied and nothing is vendored.
#
# The other kinds the schema once had (translated, algorithm, library) are gone with the material
# they described: the Krita, GIMP and GEGL behaviour ports and the babl / lcms2 adapters were removed
# in d4854f2, and no entry may use them. A `code` entry can never be copyleft again: that is what
# would make LICENSE-MIT a false statement.

[photocraft]
repository = "https://github.com/storytold/photocraft"
branch = "main"
commit = "ad96df566b587ebc056644c9e2bf621ddba39a92"
kind = "code"
prefix = "crafts/photocraft"
role = ["raster editing", "layers and masks", "brushes", "PSD/PSB, ORA, KRA, TIFF, RAW codecs", "colour management"]
license = "MIT OR Apache-2.0"
boundary = "the whole repository is vendored as a subtree; only crates/* are workspace members (apps/ and the web shell are excluded by tools/merge_workspaces.py, docs/, packaging/, xtask and the other repository furniture are deleted by tools/prune_upstream.py); docs/brand/* are ArtCraft trademarks and are neither built nor shipped"

