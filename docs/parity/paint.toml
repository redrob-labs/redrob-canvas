# Paint-depth feature inventory for Redrob Canvas v0.9.0 parity (clean room).
# Reference: Krita 5.3 as observed through its official manual (docs.krita.org) and by running the
# installed binary as a black box. Behaviour text is our own wording; no reference source was read.
# ours: none | partial | full against our crates (crafts/*, apps/*). priority: 1 daily, 2 common, 3 rare.

[[feature]]
id = "PT-ENG-001"
group = "engine"
name = "Pixel brush engine"
reference = "Krita 5.3"
manual = "https://docs.krita.org/en/reference_manual/brushes/brush_engines/pixel_brush_engine.html"
behaviour = "Default dab engine: stamps a generated, bitmap or text tip along the stroke at a spacing; every parameter (size, opacity, flow, ratio, rotation, scatter, softness, sharpness, mirror, source, mix, darken, HSV, airbrush, texture, masked tip) can be driven by sensors; multithreaded tips."
ours = "full"
ours_where = "crafts/photocraft/crates/paint/src/brush.rs, crafts/photocraft/crates/paint/src/dynamics.rs"
gap = ""
priority = 1

[[feature]]
id = "PT-ENG-002"
group = "engine"
name = "Colour smudge engine"
reference = "Krita 5.3"
manual = "https://docs.krita.org/en/reference_manual/brushes/brush_engines/color_smudge_engine.html"
behaviour = "Picks colour from under the tip and drags it; two modes (smear copies the previous dab area, dulling fills the dab with the average under it); colour rate adds foreground paint, smudge length and radius, smear alpha, overlay to sample all layers, paint thickness height map, gradient source, HSV jitter."
ours = "full"
ours_where = "crafts/photocraft/crates/paint/src/mixer.rs, crafts/photocraft/crates/engine/src/brush_cmds.rs, crafts/photocraft/crates/ui-egui/src/panels.rs"
gap = ""
priority = 1

[[feature]]
id = "PT-ENG-003"
group = "engine"
name = "Clone brush engine"
reference = "Krita 5.3"
manual = "https://docs.krita.org/en/reference_manual/brushes/brush_engines/clone_engine.html"
behaviour = "Paints a copy of another area; source set with a modifier-click; healing mode blends texture only; per-dab or per-stroke source movement; reset source each stroke; clone from all visible layers; source may be another layer."
ours = "full"
ours_where = "crafts/photocraft/crates/paint/src/retouch.rs"
gap = ""
priority = 1

[[feature]]
