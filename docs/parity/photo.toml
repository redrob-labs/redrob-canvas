# Photo mode feature inventory against the reference raster editor (clean room: manual + black-box use only).
# Schema: see docs/parity/README.md. ours = none | partial | full, judged by grepping crafts/* and apps/*.
# Hand-maintained; edit rows in place and keep ids stable.

[[feature]]
id = "PH-SEL-001"
group = "selection"
name = "Rectangle select tool"
reference = "GIMP"
manual = "https://docs.gimp.org/3.0/en/gimp-tool-rect-select.html"
behaviour = "Drag a rectangle; the live rectangle has edge and corner handles for resizing after the fact, a fixed aspect/size/width/height constraint, numeric position and size fields, optional rounded corners, highlight of the outside, composition guides (thirds, golden sections, diagonals), and an expand-from-centre modifier. Combine modes replace/add/subtract/intersect; antialias and feather options."
ours = "full"
ours_where = "crafts/photocraft/crates/ui-egui/src/marquee_tests.rs, crafts/photocraft/crates/engine/src/selection_cmds.rs"
gap = "no composition-guide overlay while dragging a selection; rounded corners handled by Select > Modify > Smooth rather than a tool option"
priority = 1

[[feature]]
id = "PH-SEL-002"
group = "selection"
name = "Ellipse select tool"
reference = "GIMP"
manual = "https://docs.gimp.org/3.0/en/gimp-tool-ellipse-select.html"
behaviour = "Same handles, constraints, numeric fields and combine modes as the rectangle tool but the region is the inscribed ellipse; antialias on by default."
ours = "full"
ours_where = "crafts/photocraft/crates/ui-egui/src/marquee_tests.rs"
gap = ""
priority = 1

[[feature]]
id = "PH-SEL-003"
group = "selection"
name = "Free select (lasso and polygon in one tool)"
reference = "GIMP"
manual = "https://docs.gimp.org/3.0/en/gimp-tool-free-select.html"
behaviour = "Dragging draws a freehand outline, single clicks place straight polygon segments, both can be mixed in one outline; the outline stays editable (move points, add segments) until confirmed with Enter or a double click. Backspace removes the last segment."
ours = "partial"
ours_where = "crafts/photocraft/crates/ui-egui/src/lasso_ui.rs, crafts/photocraft/crates/ui-egui/src/polygon_lasso_tests.rs"
gap = "lasso and polygon lasso are two separate tools; no post-hoc editing of the outline before committing"
priority = 1

[[feature]]
id = "PH-SEL-004"
group = "selection"
name = "Foreground select tool"
reference = "GIMP"
manual = "https://docs.gimp.org/3.0/en/gimp-tool-foreground-select.html"
behaviour = "Rough outline round the subject, then paint over foreground (and optionally background) strokes; a matting engine (two algorithms selectable) grows a mask with a preview overlay in a chosen colour; adjustable stroke width, preview mode (colour or grayscale), and commit to a selection or a layer mask."
ours = "partial"
ours_where = "crafts/photocraft/crates/algo/src/matting/, crafts/photocraft/crates/engine/src/smartselect_cmds.rs, crafts/photocraft/crates/ui-egui/src/select_mask_view.rs"
gap = "no two-stage outline-then-paint workflow with explicit foreground/background strokes; closest is Quick Selection plus Select and Mask refinement"
priority = 2

[[feature]]
id = "PH-SEL-005"
group = "selection"
name = "Fuzzy select (magic wand)"
reference = "GIMP"
manual = "https://docs.gimp.org/3.0/en/gimp-tool-fuzzy-select.html"
behaviour = "Click seeds a contiguous region grown by colour distance; threshold 0-255 adjustable by dragging during the click; options: antialias, feather, select transparent areas, sample merged, diagonal neighbours, draw mask preview, select-by criterion (composite, R, G, B, H, S, V, LCh L/C/H, alpha)."
ours = "partial"
ours_where = "crafts/photocraft/crates/engine/src/selection_cmds.rs (select.magicWand), crafts/photocraft/crates/algo/src/selection.rs"
gap = "no drag-to-adjust threshold, no diagonal-neighbours switch, no per-channel criterion"
priority = 1

