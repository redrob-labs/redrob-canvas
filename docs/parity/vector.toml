# Vector mode feature inventory (clean room) -- redrob-canvas v0.9.0 parity round
#
# Reference apps: the Inkscape 1.4 series (1.4.4 AppImage, run as a black box on :0; its
# published SHA256 was checked before the first run) and the vector layers of Krita 5.3.4.
# Sources: the official manuals and release notes linked in `manual` (every URL answered 200 to
# curl when this file was written), the application's own `--action-list` / `--list-input-types`
# output, and watching the running application. No reference source code or binary internals were
# read. Behaviour text is paraphrased in our own words.
#
# `ours` grades OUR crates only (crafts/vectorcraft/crates/*, apps/*): none | partial | full.
# `priority`: 1 = a daily tool, 2 = common, 3 = rare.
#
# Abbreviations in `manual`:
#   RTD  = https://inkscape-manuals.readthedocs.io/en/latest/
#   KEYS = https://inkscape.org/doc/keys.html
#   RN   = https://wiki.inkscape.org/wiki/Release_notes/<version>
#   KR   = https://docs.krita.org/en/
# (URLs below are written out in full; the abbreviations are only for this comment.)

# ---------------------------------------------------------------------------------------------
# tools
# ---------------------------------------------------------------------------------------------

[[feature]]
id = "VE-TOOL-001"
group = "tools"
name = "Selector tool (select, move, scale, rotate, skew)"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/selector-tool.html"
behaviour = "Click selects an object, drag moves it; eight corner/side handles scale, a second click on the object switches the handles to rotate/skew; rubber-band drag selects many; Shift adds to the selection, Alt-drag draws a touch-select path, Ctrl keeps proportions, Alt selects under the pointer; Tab/Shift+Tab walks objects in z-order."
ours = "full"
ours_where = "crafts/vectorcraft/crates/tools/src/select.rs, crafts/vectorcraft/crates/tools/src/bbox.rs"
gap = "no second-click toggle to rotate/skew handles (rotation is a separate tool and the bounding-box corner gesture); no touch-select Alt-drag path"
priority = 1
evidence = "docs/parity/evidence/VEC-main.png"

[[feature]]
id = "VE-TOOL-002"
group = "tools"
name = "Selector toolbar: numeric X/Y/W/H and lock ratio"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/selector-tool.html"
behaviour = "The tool controls bar shows the selection's position and size in the document unit with a lock toggle for proportional size edits, plus buttons to rotate 90 degrees either way, flip horizontally/vertically, raise/lower in z-order, and toggles for which attributes (strokes, rounded corners, gradients, patterns) scale with the object."
ours = "full"
ours_where = "crafts/vectorcraft/crates/ui-egui/src/control.rs, crafts/vectorcraft/crates/ui-egui/src/panels/transform.rs"
gap = "flip/rotate-90 buttons live in the Transform panel menu rather than the control bar"
priority = 1

[[feature]]
id = "VE-TOOL-003"
group = "tools"
name = "Node tool (edit path nodes and handles)"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/editing-paths.html"
behaviour = "Shows every node of the selected paths; nodes are dragged singly or as a rubber-band set, handles are dragged to reshape segments, a segment itself can be dragged to bend it; double-click a segment adds a node, Delete removes nodes while keeping the shape; also edits live shapes' own handles and clip/mask paths in place."
ours = "full"
ours_where = "crafts/vectorcraft/crates/tools/src/direct.rs, crafts/vectorcraft/crates/engine/src/cmd/path.rs"
gap = "segment-drag bending exists only through the Reshape/Anchor Point tools, not as the default drag on a segment"
priority = 1

[[feature]]
id = "VE-TOOL-004"
group = "tools"
name = "Rectangle tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/squares-and-rectangles.html"
behaviour = "Drag draws a live rectangle; Ctrl constrains to a square or integer ratio, Shift draws from the centre; two corner handles set horizontal and vertical corner radii independently and the toolbar exposes W, H, Rx, Ry fields and a 'make corners sharp' button."
ours = "full"
ours_where = "crafts/vectorcraft/crates/tools/src/shape.rs, crafts/vectorcraft/crates/doc/src/corners.rs"
gap = "corner radii are per-corner but symmetric (no separate Rx/Ry ellipse corners)"
priority = 1

