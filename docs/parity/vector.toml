# Vector mode feature inventory (clean room) -- redrob-canvas v0.9.0 parity round
#
# Reference apps: the Inkscape 1.4 series (1.4.4 AppImage, run as a black box on :0; its
# published SHA256 was checked before the first run) and the vector layers of Krita 5.3.4.
# Sources: the official manuals and release notes linked in `manual` (every URL answered 200 to
# curl when this file was written), the application's own `--action-list` / `--list-input-types`
# output, and watching the running application. No reference source code or binary internals were
# read. Behaviour text is paraphrased in our own words.
#
# `ours` grades OUR crates only (crafts/vectorcraft/crates/*, apps/*): none | partial | full.
# `priority`: 1 = a daily tool, 2 = common, 3 = rare.
#
# Abbreviations in `manual`:
#   RTD  = https://inkscape-manuals.readthedocs.io/en/latest/
#   KEYS = https://inkscape.org/doc/keys.html
#   RN   = https://wiki.inkscape.org/wiki/Release_notes/<version>
#   KR   = https://docs.krita.org/en/
# (URLs below are written out in full; the abbreviations are only for this comment.)

# ---------------------------------------------------------------------------------------------
# tools
# ---------------------------------------------------------------------------------------------

[[feature]]
id = "VE-TOOL-001"
group = "tools"
name = "Selector tool (select, move, scale, rotate, skew)"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/selector-tool.html"
behaviour = "Click selects an object, drag moves it; eight corner/side handles scale, a second click on the object switches the handles to rotate/skew; rubber-band drag selects many; Shift adds to the selection, Alt-drag draws a touch-select path, Ctrl keeps proportions, Alt selects under the pointer; Tab/Shift+Tab walks objects in z-order."
ours = "full"
ours_where = "crafts/vectorcraft/crates/tools/src/select.rs, crafts/vectorcraft/crates/tools/src/bbox.rs"
gap = "no second-click toggle to rotate/skew handles (rotation is a separate tool and the bounding-box corner gesture); no touch-select Alt-drag path"
priority = 1
evidence = "docs/parity/evidence/VEC-main.png"

[[feature]]
id = "VE-TOOL-002"
group = "tools"
name = "Selector toolbar: numeric X/Y/W/H and lock ratio"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/selector-tool.html"
behaviour = "The tool controls bar shows the selection's position and size in the document unit with a lock toggle for proportional size edits, plus buttons to rotate 90 degrees either way, flip horizontally/vertically, raise/lower in z-order, and toggles for which attributes (strokes, rounded corners, gradients, patterns) scale with the object."
ours = "full"
ours_where = "crafts/vectorcraft/crates/ui-egui/src/control.rs, crafts/vectorcraft/crates/ui-egui/src/panels/transform.rs"
gap = "flip/rotate-90 buttons live in the Transform panel menu rather than the control bar"
priority = 1

[[feature]]
id = "VE-TOOL-003"
group = "tools"
name = "Node tool (edit path nodes and handles)"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/editing-paths.html"
behaviour = "Shows every node of the selected paths; nodes are dragged singly or as a rubber-band set, handles are dragged to reshape segments, a segment itself can be dragged to bend it; double-click a segment adds a node, Delete removes nodes while keeping the shape; also edits live shapes' own handles and clip/mask paths in place."
ours = "full"
ours_where = "crafts/vectorcraft/crates/tools/src/direct.rs, crafts/vectorcraft/crates/engine/src/cmd/path.rs"
gap = "segment-drag bending exists only through the Reshape/Anchor Point tools, not as the default drag on a segment"
priority = 1

[[feature]]
id = "VE-TOOL-004"
group = "tools"
name = "Rectangle tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/squares-and-rectangles.html"
behaviour = "Drag draws a live rectangle; Ctrl constrains to a square or integer ratio, Shift draws from the centre; two corner handles set horizontal and vertical corner radii independently and the toolbar exposes W, H, Rx, Ry fields and a 'make corners sharp' button."
ours = "full"
ours_where = "crafts/vectorcraft/crates/tools/src/shape.rs, crafts/vectorcraft/crates/doc/src/corners.rs"
gap = "corner radii are per-corner but symmetric (no separate Rx/Ry ellipse corners)"
priority = 1

[[feature]]
id = "VE-TOOL-005"
group = "tools"
name = "Ellipse / arc tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/circles-ellipses-and-arcs.html"
behaviour = "Drag draws a live ellipse (Ctrl for a circle); two on-shape handles set start and end angles, turning it into a pie slice, a chord or an open arc, selectable in the toolbar; a button restores the whole ellipse."
ours = "partial"
ours_where = "crafts/vectorcraft/crates/tools/src/shape.rs, crafts/vectorcraft/crates/tools/src/extra.rs (arc tool)"
gap = "no start/end-angle handles on a live ellipse (pie/chord/arc); the separate Arc tool draws a quarter-arc segment only"
priority = 1

[[feature]]
id = "VE-TOOL-006"
group = "tools"
name = "Star / polygon tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/stars-and-polygons.html"
behaviour = "Toolbar toggle between polygon and star; fields for corner count, spoke ratio, rounding and randomisation; two live handles move the outer tip and inner notch, Ctrl snaps angles, Shift-drag rounds the tips, Alt-drag randomises; the shape stays editable afterwards."
ours = "partial"
ours_where = "crafts/vectorcraft/crates/tools/src/shape.rs, crafts/vectorcraft/crates/geom/src/shapes.rs"
gap = "corner count and inner radius are set in the draw dialog or by arrow keys while dragging; no rounding or randomise parameter; the result is a plain path, not a live star"
priority = 1

[[feature]]
id = "VE-TOOL-007"
group = "tools"
name = "3D box tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/3d-boxes.html"
behaviour = "Draws a box in perspective governed by three vanishing points shown as draggable targets; each of the six faces is a separately styled path inside a group; the toolbar sets each axis to a finite or infinite vanishing point and its angle; boxes share a document perspective."
ours = "partial"
ours_where = "crafts/vectorcraft/crates/tools/src/distort/perspective.rs, crafts/vectorcraft/crates/three-d/src/solid.rs"
gap = "perspective grid draws planar art in 1/2/3-point perspective and the 3D effect extrudes a face, but there is no live box primitive with draggable vanishing points"
priority = 3

[[feature]]
id = "VE-TOOL-008"
group = "tools"
name = "Spiral tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/spirals.html"
behaviour = "Drag draws a spiral; toolbar sets turns, divergence (how fast the radius grows) and inner radius; two handles adjust inner and outer ends, Alt/Ctrl on the handles change divergence or roll the spiral in or out."
ours = "partial"
ours_where = "crafts/vectorcraft/crates/tools/src/extra.rs"
gap = "turns, decay and segments set in a dialog; no live handles after drawing"
priority = 3

[[feature]]
id = "VE-TOOL-009"
group = "tools"
name = "Pencil (freehand) tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/pencil-tool.html"
behaviour = "Drag draws a path, smoothed by a 1-100 slider; click-click draws straight segments; modes: regular Bezier, Spiro, BSpline; a shape can be applied along the stroke (triangle in/out, ellipse, from clipboard, bend from clipboard); 'LPE based interactive simplify'; pressure-sensitive width when a tablet is used ('PowerPencil')."
ours = "partial"
ours_where = "crafts/vectorcraft/crates/tools/src/draw2.rs, crafts/vectorcraft/crates/pathops/src/fit.rs, crafts/vectorcraft/crates/engine/src/cmd/draw2.rs"
gap = "no Spiro or BSpline mode, no shape-along-stroke option on the freehand tool (brushes do that), no pressure width while drawing"
priority = 1

[[feature]]
id = "VE-TOOL-010"
group = "tools"
name = "Pen (Bezier) tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/pen-tool.html"
behaviour = "Click places corner nodes, click-drag places smooth nodes with handles; Ctrl snaps angles to 15 degree steps, Shift locks handle length, Enter or double-click ends the path, clicking the start closes it; modes: regular Bezier, Spiro spline, BSpline, straight segments, paraxial (axis-aligned) segments; same shape-along-stroke options as the pencil."
ours = "partial"
ours_where = "crafts/vectorcraft/crates/tools/src/pen.rs, crafts/vectorcraft/crates/tools/src/draw2/family.rs"
gap = "no Spiro, BSpline or paraxial modes; rubber-band preview of the next segment exists but no shape-along-path option"
priority = 1

[[feature]]
id = "VE-TOOL-011"
group = "tools"
name = "Calligraphy tool"
reference = "Inkscape"
manual = "https://inkscape-manuals.readthedocs.io/en/latest/calligraphy-tool.html"
behaviour = "Draws a filled stroke whose width follows velocity (thinning), pen angle, fixation, caps, tremor, wiggle and mass settings; presets Dip pen, Marker, Brush, Wiggly, Splotchy, Tracing; pressure and tilt from a tablet can drive width and angle; Alt-drag on an existing stroke engraves hatching guided by it."
ours = "partial"
ours_where = "crafts/vectorcraft/crates/brush/src/calli.rs, crafts/vectorcraft/crates/engine/src/cmd/brushsym.rs"
gap = "calligraphic brush has angle, roundness, diameter and pressure variation; no thinning-by-speed, tremor, wiggle, mass or guided hatching"
priority = 2

