name: Release

# The ONE release path: every platform is built on GitHub runners, Windows is signed through Azure
# Artifact Signing with the job's OpenID Connect login, macOS is signed and notarized with the
# organization's Developer ID, and the shared redrob-labs publish job creates the GitHub Release.
#
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z           # the release: PUBLISHED as latest
#   gh workflow run release.yml --ref <branch> -f dry_run=true     # builds and signs; publishes nothing
#
# The parts every redrob-labs repository shares are not in this file; they are called:
#   - redrob-labs/.github/actions/sign-windows                     Authenticode through Azure Artifact Signing
#   - redrob-labs/.github/.github/workflows/release-publish.yml    checksums, launcher manifest, release
#
# Rules this file encodes:
#   - Windows: build, THEN `azure/login` (OIDC), THEN sign -- the login token is short-lived and the
#     build is long; there is no certificate file and no client secret anywhere. The executable is
#     signed BEFORE it is zipped and before the setup embeds that zip; the uninstaller and the setup
#     are signed in their turn. `release` is the environment the organization's federated credential
#     names; any other name is refused.
#   - the publish job runs only for a real tag, and only when every job before it succeeded;
#   - the release is published as latest unless the version carries a pre-release suffix.
#
# This is a Qt 6 CMake application, not a Tauri app, so there is no framework doing the signing:
# each platform's signing, notarization and deployment is explicit below. Qt comes from the
# official installer at a pinned version via aqtinstall, because no runner image ships a Qt new
# enough for the floor native/qt/CMakeLists.txt requires.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, vMAJOR.MINOR.PATCH, already pushed and on main (empty for a dry run)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run: build and sign the dispatched ref, publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag != '' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PRODUCT: Redrob Canvas
  PRODUCT_URL: https://github.com/${{ github.repository }}
  # 6.11.2, the newest patch of a settled branch, not the newest branch. 6.12.0 was pinned
  # briefly and every macOS and Windows leg died installing it: download.qt.io answered
  # Updates.xml but 404'd the archive checksums, days after release. Probed directly before
  # choosing this -- for 6.11.1, 6.11.2 and 6.12.0, on Linux, macOS and Windows.
  #
  # That probe concluded "both 6.11 patches were complete everywhere", and the first Windows
  # leg falsified it. The archives are complete; the Windows METADATA lives at a different
  # path from 6.11 onwards, and the released aqtinstall asks for the Linux-shaped one. So the
  # pin here is sound and the INSTALLER had to change instead -- see the comment on the
  # Install Qt step. A probe that reads one host's layout cannot speak for another's.
  #
  # The floor in native/qt/CMakeLists.txt is 6.11 to match. The lint test that used to force
  # 6.12 now probes qmllint for --only-explicit-categories instead of requiring it.
  QT_VERSION: 6.11.2

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      # The version without the leading v, the commit every later job builds, and whether this is a
      # dry run. For a tag the commit is the tag's; for a dry run it is the dispatched ref's.
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      # The build matrix, the platform assets the release must carry, and the platform list the
      # release notes promise -- all from the single list in tools/release_matrix.py.
      matrix: ${{ steps.release-matrix.outputs.matrix }}
      archive_suffixes: ${{ steps.release-matrix.outputs.archive_suffixes }}
      installer_suffixes: ${{ steps.release-matrix.outputs.installer_suffixes }}
      notes_platforms: ${{ steps.release-matrix.outputs.notes_platforms }}
      windows_signing_ready: ${{ steps.release-matrix.outputs.windows_signing_ready }}
    steps:
      # A dry run builds whatever was dispatched; a release builds the tag it names. Resolved
      # before the checkout so the checkout can take the result.
      - name: Resolve what to build
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run of $GITHUB_REF_NAME ($GITHUB_SHA): builds and signs, publishes nothing"
          elif [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::not a release tag: $INPUT_TAG"; exit 1; }
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::give a tag (the release) or set dry_run (a rehearsal); neither was given"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      # Decides which platforms this release builds. Windows is omitted, with a notice in the
      # run log, until the repository variable WINDOWS_SIGNING_READY is "true" -- see the
      # script for why an unsigned Windows executable is not the fallback.
      - name: Resolve the release matrix
        id: release-matrix
        env:
          WINDOWS_SIGNING_READY: ${{ vars.WINDOWS_SIGNING_READY }}
        run: python3 tools/release_matrix.py

      # The packaging step derives the version from the TAG, while the binary reports the one in
      # Cargo.toml. Nothing made the two agree, so a v0.3.0 tag could ship archives named 0.3.0
      # holding a binary that calls itself 0.2.0 -- and nothing in a build or a test would say
      # so, because both numbers are individually valid. Checked here, before anything is built.
      # A dry run has no tag: it takes the crate version as it is and skips the tag checks.
      - name: Require the tag on main, matching the crate version and the changelog
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          test -n "$crate_version"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "version=${crate_version}" >> "$GITHUB_OUTPUT"
            echo "dry run: building Cargo.toml version ${crate_version} at $(git rev-parse --short HEAD)"
            exit 0
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main"
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag v${tag_version} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi
          # The release notes say "See CHANGELOG", so a release whose version has no entry there
          # ships notes that describe nothing.
          if ! grep -q "^## ${tag_version} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${tag_version}' section"
            exit 1
          fi
          if grep -q "^## ${tag_version} — unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still marks ${tag_version} as unreleased"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Verify the upstream pins
        run: ./scripts/verify-upstream.sh

      # The generator reads Cargo metadata offline on purpose; populate the cache first.
      - name: Populate the Cargo registry cache
        run: cargo fetch --locked

      # A stale notice inventory is a GPL compliance defect, so it blocks the release
      # rather than being corrected afterwards.
      - name: Check the generated notices and source offer
        run: python3 tools/generate_distribution_artifacts.py --check

      - name: Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  build:
    name: Build ${{ matrix.label }}
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs/<repo>:environment:release); any other name is refused by Azure.
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential (Windows leg).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Generated by tools/release_matrix.py in the validate job, so the Windows leg can be
        # excluded while Authenticode signing is not configured, and so the asset names the
        # verify job demands and the platform list the release notes promise come from that
        # same single list.
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      # Plain IDs (not credentials); here so the login step can be skipped when signing is not set up.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          # aqtinstall from a PINNED COMMIT, not the newest release, because no release can
          # install Qt 6.11 on Windows at all.
          #
          # Qt split the Windows desktop repository per toolchain at 6.11:
          #   linux_x64/desktop/qt6_6112/qt6_6112/Updates.xml
          #   windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64/Updates.xml
          # aqtinstall 3.3.0 asks for the Linux-shaped path on every host, so it 404s on the
          # metadata and reports "Failed to locate XML data for Qt version '6.11.2'". Retrying
          # cannot fix a path that does not exist, which is why the first Windows leg burned all
          # three attempts.
          #
          # Measured, not inferred, before pinning this: with released 3.3.0, Windows resolves
          # 6.8.3, 6.9.3 and 6.10.0 and fails on 6.11.0, 6.11.1, 6.11.2, 6.11.3 and 6.12.0 --
          # so the boundary is exactly where Qt changed the layout. With this commit, Windows
          # 6.11.2 resolves win64_msvc2022_64 and lists qtsvg, which find_package requires, and
          # macOS clang_64 and Linux linux_gcc_64 still resolve unchanged.
          #
          # The fix is miurahr/aqtinstall#1000 ("Support Qt 6.11+ for Windows x64"), merged
          # 2026-03-24. The newest PyPI release, 3.3.0, is from 2025-06-02 and predates it by
          # nine months, so there is no released version to upgrade to. The alternative was
          # dropping to Qt 6.10 -- rejected: the CMake floor is 6.11, and pinning Windows alone
          # to 6.10 would ship a different Qt on one platform than on the other two.
          #
          # Pinned by commit sha, not a branch, so this cannot drift onto unreviewed master.
          AQT_SPEC='aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          python3 -m pip install --user --break-system-packages "$AQT_SPEC" \
            || python3 -m pip install --user "$AQT_SPEC"
          # No --modules: for Qt 6 the Svg module that native/qt/CMakeLists.txt requires
          # is part of the base desktop install, not an addon. Asking aqt for `qtsvg`
          # fails outright ("were not found while parsing XML of package information"),
          # which is how the first release run died. If Svg were ever missing from the
          # base package, find_package(Qt6 ... Svg) fails loudly at configure time.
          #
          # Retried because download.qt.io intermittently fails to serve a checksum for an
          # archive it does hold. That is also why this pin is a settled branch rather than
          # the newest one: 6.12.0's Windows qtsvg .sha256 was still 404 days after release,
          # and no number of retries fixes a file the mirror does not have. A retry is cheap
          # insurance for a transient miss. It retries the DOWNLOAD; it does NOT skip or
          # weaken verification, so a genuinely corrupt or absent archive still fails the
          # build on the last attempt.
          attempt=1
          until python3 -m aqt install-qt "${{ matrix.aqt_host }}" desktop "${QT_VERSION}" \
            "${{ matrix.aqt_arch }}" --outputdir "$RUNNER_TEMP/Qt"; do
            if [ "$attempt" -ge 3 ]; then
              echo "aqt install-qt failed $attempt times; giving up" >&2
              exit 1
            fi
            echo "aqt install-qt attempt $attempt failed; retrying in $((attempt * 30))s" >&2
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done
          qt_prefix="$RUNNER_TEMP/Qt/${QT_VERSION}/${{ matrix.qt_dir }}"
          # A bare `test -d` here fails with no output, and the one thing that could still be
          # wrong after the installer change is this directory's NAME: the matrix declares
          # qt_dir per leg, and aqt chooses it. So say what is actually on disk rather than
          # making the next person re-run the job to find out.
          if [ ! -d "$qt_prefix" ]; then
            echo "::error::expected Qt at $qt_prefix; aqt installed these instead:"
            ls -1 "$RUNNER_TEMP/Qt/${QT_VERSION}" 2>/dev/null || ls -1 "$RUNNER_TEMP/Qt" 2>/dev/null
            exit 1
          fi
          echo "CMAKE_PREFIX_PATH=$qt_prefix" >> "$GITHUB_ENV"
          echo "QT_PREFIX=$qt_prefix" >> "$GITHUB_ENV"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build
          libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev
          libx11-xcb-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0
          libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # macOS: import the Developer ID certificate into a throwaway keychain and read the
      # identity back out, rather than assuming its name.
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redrob-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/redrob-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/redrob-build.keychain"
          security import "$RUNNER_TEMP/redrob-certificate.p12" -k "$RUNNER_TEMP/redrob-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/redrob-build.keychain" | awk -F'"' 'NR==1 {print $2}')"
          test -n "$CERT_ID"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/redrob-certificate.p12"

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_API_KEY_ID APPLE_NOTARY_API_ISSUER_ID; do
            test -n "${!name:-}"
          done
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # CMake's configure step runs the distribution check, which reads Cargo metadata with
      # --locked --offline on purpose. On a cold runner the registry index is empty, so that
      # read fails ("no matching package named font8x8") and configure aborts before
      # compiling anything. The validate job already does this; the build job needs it too,
      # on every platform, because the check runs again here.
      - name: Populate the Cargo registry cache
        shell: bash
        run: cargo fetch --locked

      # Ninja on Unix; the Visual Studio generator on Windows so MSVC is located without a
      # developer shell. That makes Windows multi-config, hence --config on build/install.
      #
      # The generator name is DERIVED, not written here. It used to say "Visual Studio 17 2022"
      # and the first Windows leg died on "could not find any instance of Visual Studio": the
      # runner image is windows-2025-vs2026 and ships Visual Studio Enterprise 2026 (18.10) at
      # C:\Program Files\Microsoft Visual Studio\18\Enterprise. Hardcoding the next year would
      # fail again the next time GitHub rolls the image.
      #
      # So ask the machine twice and intersect the answers: vswhere says which major version is
      # INSTALLED, and `cmake --help` says which generator names this CMake SUPPORTS. A match is
      # a generator that exists on both sides. If either side has nothing to say, that is a hard
      # failure with both answers printed -- not a silent fallback to a generator that cannot
      # build.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            if [ ! -x "$vswhere" ]; then
              echo "::error::vswhere.exe not found at $vswhere; cannot tell which Visual Studio this image ships"
              exit 1
            fi
            vs_major="$("$vswhere" -latest -products '*' -property installationVersion \
              | tr -d '\r' | cut -d. -f1)"
            generator="$(cmake --help | grep -oE "Visual Studio ${vs_major} [0-9]{4}" | head -n 1)"
            if [ -z "${vs_major:-}" ] || [ -z "$generator" ]; then
              echo "::error::no Visual Studio generator this CMake supports matches the installed version"
              echo "installed major version: '${vs_major:-none}'"
              echo "generators this CMake offers:"
              cmake --help | grep -E 'Visual Studio [0-9]+' || true
              exit 1
            fi
            echo "Using generator: $generator (Visual Studio $vs_major installed)"
            cmake -S native -B build/qt -G "$generator" -A x64
          else
            cmake -S native -B build/qt -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      # redrob_source_bundle is an ALL target that redrob-canvas depends on, so the GPL
      # corresponding-source archive is produced by this build rather than a separate step.
      - name: Build
        shell: bash
        run: cmake --build build/qt --config Release

      # The smoke tests set QT_QPA_PLATFORM=offscreen/minimal with a timeout, so they run
      # headless on every platform.
      - name: Test
        shell: bash
        run: ctest --test-dir build/qt --build-config Release --output-on-failure

      - name: Install to a staging prefix
        shell: bash
        run: cmake --install build/qt --config Release --prefix "$RUNNER_TEMP/stage"

      # Qt's own libraries and QML plugins are not in the install prefix; windeployqt and
      # macdeployqt bring them in, otherwise the shipped binary cannot start. On Linux the
      # bundler copies Qt into the tree the same way (until 0.5.5 the archive carried the binary
      # alone and started only where Qt 6.11 was already installed system-wide).
      - name: Deploy Qt runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tools/release/bundle_linux_qt.py "$RUNNER_TEMP/stage" "$QT_PREFIX"

      - name: Deploy Qt runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          macdeployqt "$RUNNER_TEMP/stage/Redrob Canvas.app" -qmldir="$PWD/qml"

      # The bundle's version is what Finder, the About box and Gatekeeper show. It once came from
      # a literal in native/CMakeLists.txt and shipped two releases saying 0.3, so it is checked
      # against the crate version (which validate already tied to the tag) before signing.
      - name: Require the bundle version to match the crate version (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          plist="$RUNNER_TEMP/stage/Redrob Canvas.app/Contents/Info.plist"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          for key in CFBundleShortVersionString CFBundleVersion; do
            bundle_version="$(plutil -extract "$key" raw -o - "$plist")"
            if [ "$bundle_version" != "$crate_version" ]; then
              echo "::error::Info.plist $key is $bundle_version, Cargo.toml is $crate_version"
              exit 1
            fi
          done

      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          windeployqt.exe "$RUNNER_TEMP/stage/bin/Redrob Canvas.exe" --qmldir "$PWD/qml" --release

      - name: Sign, notarize and staple (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/stage/Redrob Canvas.app"

          # Deep sign after deployment, since macdeployqt copies unsigned Qt frameworks in.
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # notarytool takes an archive, not a bundle; ditto --keepParent preserves the
          # .app directory structure that a plain zip mangles.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
            --wait

          # Stapling and validating both look the ticket up in Apple's CloudKit service, and that
          # lookup drops: v0.5.6 failed three times on "The network connection was lost" (error 68)
          # after notarization was Accepted -- twice in staple, once in validate. Each network step
          # is retried with backoff; a real refusal fails every attempt and the job.
          retry() {
            local i
            for i in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              [ "$i" -lt 6 ] || { echo "::error::failed after 6 attempts: $*"; return 1; }
              echo "::warning::attempt $i of 6 failed: $*; retrying in $((i * 20))s"
              sleep $((i * 20))
            done
          }
          retry xcrun stapler staple "$app"
          retry xcrun stapler validate "$app"
          # Gatekeeper's own verdict, which is what a user's machine actually applies.
          retry spctl --assess --type execute --verbose=4 "$app"
          rm -f "$RUNNER_TEMP/notarize.zip"

      # The login comes after the build on purpose: the OpenID Connect token is short-lived and a
      # long build left signtool without a usable credential (it then waited on a browser).
      - name: Log in to Azure (OIDC)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The executable is signed BEFORE it is zipped: the portable zip and the setup both carry it
      # as is. A glob rather than the name, because the action splits its file list on whitespace
      # and the executable is "Redrob Canvas.exe".
      - name: Sign the executable (Windows)
        if: runner.os == 'Windows'
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: ${{ runner.temp }}/stage/bin/*.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts"
          mkdir -p "$out"
          base="redrob-canvas-${VERSION}-${{ matrix.slug }}"

          case "$RUNNER_OS" in
            macOS)
              # Archive the whole staging tree, not just the .app, so LICENSE, COPYRIGHT,
              # the notices and the source offer travel with the binary as the GPL wants.
              # ditto (not zip/cp) because it preserves the code signature's extended
              # attributes and the stapled notarization ticket inside the bundle.
              mv "$RUNNER_TEMP/stage" "$RUNNER_TEMP/${base}"
              ( cd "$RUNNER_TEMP" && ditto -c -k --sequesterRsrc --keepParent "$base" "$out/${base}.zip" )
              ;;
            Windows)
              # `-portable`: the unpacked, signed app, which Redrob Launcher unzips and runs in place.
              powershell -NoProfile -Command \
                "Compress-Archive -Path '$RUNNER_TEMP/stage/*' -DestinationPath '$out/${base}-portable.zip' -Force"
              ;;
            *)
              tar -C "$RUNNER_TEMP/stage" -czf "$out/${base}.tar.gz" .
              # The same tree as a package for apt; the system's own uninstall removes it.
              python3 tools/release/make_deb.py "$RUNNER_TEMP/stage" "$VERSION" "$out/${base}.deb"
              ;;
          esac

          # The corresponding-source archive is identical on every platform, so it is
          # attached once, from Linux, rather than three times under the same name.
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp build/qt/redrob-canvas-corresponding-source.tar.gz \
              "$out/redrob-canvas-${VERSION}-corresponding-source.tar.gz"
            cp THIRD_PARTY_NOTICES.md SOURCE_OFFER.md LICENSE COPYRIGHT "$out/"
          fi

          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'dir=%s\n' "$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      # The disk image most people download: the stapled app, an Applications link, the uninstaller
      # and the licences, on the branded window (installer/macos/). The image is signed, notarized and
      # stapled in its own right, so Gatekeeper accepts it before anyone opens the app inside.
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          BASE: ${{ steps.package.outputs.base }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          # A venv: the runner's Homebrew Python is "externally managed" (PEP 668) and refuses
          # `pip install --user`, which is how the first run of this step failed on v0.5.6.
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install --quiet "dmgbuild==1.6.5"
          export PATH="$RUNNER_TEMP/dmgbuild-venv/bin:$PATH"  # make-dmg.sh runs `python3 -m dmgbuild`
          dmg="$RUNNER_TEMP/artifacts/${BASE}.dmg"
          bash installer/macos/make-dmg.sh \
            --app "$RUNNER_TEMP/$BASE/Redrob Canvas.app" \
            --licenses "$RUNNER_TEMP/$BASE/share/redrob-canvas/licenses" \
            --version "$VERSION" --sign-identity "$APPLE_SIGNING_IDENTITY" --out "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
            --wait
          # The same retry as the app's staple, above (each step is its own shell).
          retry() {
            local i
            for i in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              [ "$i" -lt 6 ] || { echo "::error::failed after 6 attempts: $*"; return 1; }
              echo "::warning::attempt $i of 6 failed: $*; retrying in $((i * 20))s"
              sleep $((i * 20))
            done
          }
          retry xcrun stapler staple "$dmg"
          retry xcrun stapler validate "$dmg"
          retry spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      # The setup carries the signed zip above and the uninstaller, so it is built after signing:
      # uninstaller first, signed, then embedded; the setup last, signed. installer/windows/README.md.
      - name: Build the uninstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "setup"
          python installer/windows/build.py --out $work --version $env:VERSION --uninstaller-only
          if ($LASTEXITCODE -ne 0) { throw "uninstaller build failed ($LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath (Join-Path $work "uninstall/Uninstall Redrob Canvas.exe"))) {
            throw "uninstaller was not built"
          }

      - name: Sign the uninstaller (Windows)
        if: runner.os == 'Windows'
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: ${{ runner.temp }}/setup/uninstall/*.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - name: Build the setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BASE: ${{ steps.package.outputs.base }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "setup"
          $zip = Join-Path $env:RUNNER_TEMP "artifacts/$env:BASE-portable.zip"
          $setupName = "$env:BASE-setup.exe"
          $uninstaller = Join-Path $work "uninstall/Uninstall Redrob Canvas.exe"
          python installer/windows/build.py --out $work --version $env:VERSION --payload $zip `
            --uninstaller $uninstaller --name $setupName
          if ($LASTEXITCODE -ne 0) { throw "setup build failed ($LASTEXITCODE)" }
          $setup = Join-Path $work $setupName
          # The setup must carry exactly the zip that ships beside it; a stale payload would install
          # a different build than the one its checksum file describes.
          if ((Get-Item -LiteralPath $setup).Length -le (Get-Item -LiteralPath $zip).Length) {
            throw "setup is not larger than the zip it should embed"
          }
          Copy-Item -LiteralPath $setup -Destination (Join-Path $env:RUNNER_TEMP "artifacts/$setupName")

      - name: Sign the setup (Windows)
        if: runner.os == 'Windows'
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: ${{ runner.temp }}/artifacts/*-setup.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      # `release-*` is the prefix the shared publish job collects; the checksums and the launcher
      # manifest are written there, over every platform's files at once.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: ${{ steps.package.outputs.dir }}/*
          if-no-files-found: error

  verify-release-assets:
    name: Signed builds and GPL source accompany the release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Shipping a GPL binary without its corresponding source is a licence violation, not
      # an oversight to fix later, and a missing platform is a release that silently ships
      # less than its notes claim. Both fail here, BEFORE the release is published, rather than
      # appearing on a checklist someone reads afterwards.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Assert every platform and every licence artifact is present
        env:
          REQUIRED_ARCHIVES: ${{ needs.validate.outputs.archive_suffixes }} ${{ needs.validate.outputs.installer_suffixes }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(ls -1 artifacts)"
          echo "Assets built:"
          printf '  %s\n' $names

          # Platform archives and installers come from the same generator that built the matrix,
          # so a leg that was deliberately not built is not demanded here, and one that WAS built
          # cannot be quietly missing. Glob matching, since the list crosses a job output boundary
          # where regex escaping is easy to get silently wrong.
          for suffix in ${REQUIRED_ARCHIVES}; do
            found=0
            for name in $names; do
              case "$name" in
                *"$suffix") found=1; break ;;
              esac
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::no asset ending in ${suffix}; a platform this run built produced no archive"
              exit 1
            fi
          done

          # The licence artifacts are unconditional: they do not depend on which platforms were
          # built, and shipping a GPL binary without its corresponding source is a violation.
          # The checksums and redrob-launcher.json are the publish job's: it writes both over this
          # same set of files.
          for pattern in \
            'corresponding-source\.tar\.gz$' \
            '^SOURCE_OFFER\.md$' \
            '^THIRD_PARTY_NOTICES\.md$' \
            '^LICENSE$' \
            '^COPYRIGHT$'; do
            if ! printf '%s\n' $names | grep -qE "$pattern"; then
              echo "::error::no asset matching ${pattern}; the GPL obligation requires the corresponding source, offer, notices and licence alongside every binary"
              exit 1
            fi
          done

          if printf '%s\n' $names | grep -q '\.unsigned\.'; then
            echo "::error::an unsigned archive is among the assets"
            exit 1
          fi

          echo "Every built platform asset (${REQUIRED_ARCHIVES}), the corresponding source, the source offer, notices and licence are present."

  # The shared redrob-labs publish job: SHA256SUMS.txt over every asset, redrob-launcher.json (this
  # app reads the launcher's shared sign-in), and the release v<version> created and PUBLISHED as
  # latest (prerelease when the version carries a `-`). Only for a real tag, never for a dry run,
  # and only when every job before it succeeded. `tag` and `target` are passed explicitly because
  # this workflow is dispatched from a branch: github.sha is the branch head, not the tag's commit.
  publish:
    needs: [validate, build, verify-release-assets]
    if: always() && needs.validate.outputs.dry_run != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.validate.outputs.version }}
      title: Redrob Canvas
      launcher_manifest: true
      publish: true
      tag: ${{ inputs.tag }}
      target: ${{ needs.validate.outputs.sha }}
