name: Release

# Signs a release whose builds were made on our own machines.
#
# tools/release/local-release.sh is the entry point: it checks the tag, builds and tests Linux,
# macOS and Windows on our own machines at the same time, creates the DRAFT release with the
# Linux archive, the corresponding source, the licence files and the two UNSIGNED archives on it,
# and starts this workflow for the tag. The certificates never leave GitHub, so signing stays
# here. Both signing jobs run at the same time; the draft already exists, so they cannot race to
# create it.
#
# Publishing the draft is the release; there is no CDN and no promotion step. When the build
# machines are unavailable, release-ci.yml builds every platform on runners instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, vMAJOR.MINOR.PATCH, already pushed and on main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # write, not read: GitHub lists a DRAFT release only to a caller with push access.
    permissions:
      contents: write
    outputs:
      archive_suffixes: ${{ steps.release-matrix.outputs.archive_suffixes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve the release matrix
        id: release-matrix
        env:
          WINDOWS_SIGNING_READY: ${{ vars.WINDOWS_SIGNING_READY }}
        run: python3 tools/release_matrix.py

      # The tests are NOT re-run: the commit reached main through pull requests whose required
      # checks ran them, and a second run was a third of the old release's wall time.
      - name: Require the tag on main, matching the crate version and the changelog
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $RELEASE_TAG"; exit 1; }
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi
          if ! grep -q "^## ${version} " CHANGELOG.md || grep -q "^## ${version} — unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no released '## ${version}' section"
            exit 1
          fi

      - name: Populate the Cargo registry cache
        run: cargo fetch --locked

      # A stale notice inventory is a GPL compliance defect, so it blocks the release.
      - name: Check the generated notices and source offer
        run: python3 tools/generate_distribution_artifacts.py --check --gegl OFF --krita OFF

      - name: Require the draft and the three builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          names="$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft,assets \
            -q 'if .isDraft then .assets[].name else error("not a draft") end')"
          for name in "redrob-canvas-${version}-linux-x86_64.tar.gz" \
                      "redrob-canvas-${version}-macos-arm64.unsigned.zip" \
                      "redrob-canvas-${version}-windows-x86_64.unsigned.zip"; do
            printf '%s\n' "$names" | grep -qxF "$name" \
              || { echo "::error::$name is not on the draft; run tools/release/local-release.sh"; exit 1; }
          done

  sign-macos:
    name: Sign macOS arm64
    needs: [validate]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    environment: production-release
    steps:
      # The archive the build machine uploaded. Downloaded by name, so a stale file from another
      # version cannot be picked up.
      - name: Download the unsigned build
        id: unpack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: macos-arm64
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="redrob-canvas-${version}-${SUFFIX}"
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            -p "${base}.unsigned.zip" -D "$RUNNER_TEMP"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          ditto -x -k "$RUNNER_TEMP/${base}.unsigned.zip" "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/$base/Redrob Canvas.app"

      # macOS: import the Developer ID certificate into a throwaway keychain and read the
      # identity back out, rather than assuming its name.
      - name: Import Apple Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redrob-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/redrob-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/redrob-build.keychain"
          security import "$RUNNER_TEMP/redrob-certificate.p12" -k "$RUNNER_TEMP/redrob-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/redrob-build.keychain" | awk -F'"' 'NR==1 {print $2}')"
          test -n "$CERT_ID"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/redrob-certificate.p12"

      - name: Prepare Apple notarization key
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_API_KEY_ID APPLE_NOTARY_API_ISSUER_ID; do
            test -n "${!name:-}"
          done
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Sign, notarize and staple
        shell: bash
        env:
          BASE: ${{ steps.unpack.outputs.base }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/$BASE/Redrob Canvas.app"

          # Deep sign: macdeployqt on the build Mac copied unsigned Qt frameworks in, and its
          # ad-hoc signature is replaced here.
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # notarytool takes an archive, not a bundle; ditto --keepParent preserves the
          # .app directory structure that a plain zip mangles.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          # Gatekeeper's own verdict, which is what a user's machine actually applies.
          spctl --assess --type execute --verbose=4 "$app"
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"

      # The whole staging tree, so the licence, notices and source offer travel with the binary.
      # ditto (not zip) keeps the signature's extended attributes and the stapled ticket.
      - name: Package
        shell: bash
        env:
          BASE: ${{ steps.unpack.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          ( cd "$RUNNER_TEMP" && ditto -c -k --sequesterRsrc --keepParent "$BASE" "artifacts/${BASE}.zip" )

      - name: Replace the unsigned build on the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.unpack.outputs.base }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts"
          ( cd "$out" && shasum -a 256 ./* > "${BASE}-SHA256SUMS.txt" 2>/dev/null \
            || sha256sum ./* > "${BASE}-SHA256SUMS.txt" )
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "$out"/*
          gh release delete-asset "$RELEASE_TAG" "${BASE}.unsigned.zip" -R "$GITHUB_REPOSITORY" --yes

  sign-windows:
    name: Sign Windows x64
    needs: [validate]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    environment: production-release
    steps:
      # The archive the build machine uploaded. Downloaded by name, so a stale file from another
      # version cannot be picked up.
      - name: Download the unsigned build
        id: unpack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: windows-x86_64
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="redrob-canvas-${version}-${SUFFIX}"
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            -p "${base}.unsigned.zip" -D "$RUNNER_TEMP"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/stage"
          powershell -NoProfile -Command \
            "Expand-Archive -LiteralPath '$RUNNER_TEMP/${base}.unsigned.zip' -DestinationPath '$RUNNER_TEMP/stage'"

      # Windows: same certificate-shape validation the sibling products use -- a PFX with a
      # private key, the Code Signing EKU, currently valid, and a chain that builds.
      - name: Import Windows code-signing certificate
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw "Windows signing secrets are required"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "redrob-certificate.pfx"
          $link = $env:WIN_CSC_LINK.Trim()
          if ($link -match '^https://') {
            Invoke-WebRequest -Uri $link -OutFile $certificatePath -UseBasicParsing
          } else {
            if ($link -match '^data:[^,]*;base64,') {
              $payload = $link.Substring($link.IndexOf(',') + 1)
            } else {
              $payload = $link
            }
            $payload = $payload -replace '\s', ''
            if ($payload -notmatch '^[A-Za-z0-9+/]+={0,2}$') {
              throw "WIN_CSC_LINK must be raw Base64 PFX data, a data:*;base64 URI, or an HTTPS URL"
            }
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($payload))
          }
          $password = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          # Read the EKU out of the X.509 extension itself, not out of PowerShell's
          # EnhancedKeyUsageList. That list's ObjectId is already a STRING, so the
          # `.ObjectId.Value` this used to compare is always $null and the `-contains` never
          # matched -- the filter rejected the organisation's certificate, which does carry
          # Code Signing. A sibling product's diagnostic printed `eku=Code Signing ()` and
          # "EKU is not Code Signing" in the same breath, which is the shape of a check
          # reading the wrong property rather than a certificate that is wrong.
          function Get-EkuOid([Security.Cryptography.X509Certificates.X509Certificate2]$candidate) {
            $oids = @()
            foreach ($extension in $candidate.Extensions) {
              if ($extension.Oid.Value -ne "2.5.29.37") { continue }
              $eku = $extension -as [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]
              if ($null -eq $eku) { continue }
              foreach ($usage in $eku.EnhancedKeyUsages) {
                $oids += if ($usage.FriendlyName) { "$($usage.FriendlyName) ($($usage.Value))" } else { $usage.Value }
              }
            }
            return $oids
          }
          $certificate = $imported | Where-Object {
            $_.HasPrivateKey -and
            $_.NotBefore.ToUniversalTime() -le [DateTime]::UtcNow -and
            $_.NotAfter.ToUniversalTime() -gt [DateTime]::UtcNow -and
            ((Get-EkuOid $_) -match [regex]::Escape($codeSigningOid))
          } | Sort-Object NotAfter -Descending | Select-Object -First 1
          if (-not $certificate -or -not $certificate.Thumbprint) {
            # One message for three independent conditions is not diagnosable: an expired
            # certificate, one with no private key, and one issued for the wrong purpose all
            # read the same. Only public metadata is printed -- never the key, the password,
            # or the PFX bytes.
            Write-Host "Imported $($imported.Count) certificate(s); none usable for code signing:"
            foreach ($candidate in $imported) {
              $ekus = @(Get-EkuOid $candidate)
              $reasons = @()
              if (-not $candidate.HasPrivateKey) { $reasons += "no private key" }
              if ($candidate.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow) { $reasons += "not valid until $($candidate.NotBefore.ToUniversalTime().ToString('u'))" }
              if ($candidate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) { $reasons += "EXPIRED $($candidate.NotAfter.ToUniversalTime().ToString('u'))" }
              if ($ekus.Count -eq 0) { $reasons += "no Enhanced Key Usage at all" }
              elseif ($ekus -notmatch [regex]::Escape($codeSigningOid)) { $reasons += "EKU is not Code Signing" }
              Write-Host "  subject=$($candidate.Subject)"
              Write-Host "    validity=$($candidate.NotBefore.ToUniversalTime().ToString('u')) .. $($candidate.NotAfter.ToUniversalTime().ToString('u'))"
              Write-Host "    hasPrivateKey=$($candidate.HasPrivateKey)  eku=$(if ($ekus.Count) { $ekus -join ', ' } else { '(none)' })"
              Write-Host "    unusable because: $($reasons -join '; ')"
            }
            throw "WIN_CSC_LINK holds no certificate usable for Authenticode signing. See the per-certificate reasons above; the secret needs a PFX with a private key, an unexpired validity window, and the Code Signing EKU ($codeSigningOid)."
          }
          # The organisation's code-signing certificate is SELF-SIGNED. Measured, not assumed:
          # the chain terminates in "a root certificate which is not trusted by the trust
          # provider", and a sibling product that signs with this same secret says so in its
          # own workflow and accepts NotTrusted there.
          #
          # So an untrusted or incomplete root is expected and is NOT a defect to fail on.
          # Everything else still is -- a revoked certificate, one outside its validity window,
          # a broken signature, a bad usage. Those are listed explicitly rather than the check
          # being deleted, because deleting it would also stop catching a revoked certificate.
          #
          # WHAT THIS BUYS AND WHAT IT DOES NOT. It buys tamper-evidence and a stable publisher
          # identity: the binary cannot be modified without breaking the signature. It does NOT
          # buy trust -- Windows SmartScreen still warns the user that the publisher is
          # unknown, exactly as it would for an unsigned binary. Removing that warning needs an
          # OV or EV certificate from a CA whose root ships in Windows; no change to this
          # workflow can substitute for one.
          $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
          $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::Online
          $chain.ChainPolicy.RevocationFlag = [Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
          $built = $chain.Build($certificate)
          $tolerated = @("UntrustedRoot", "PartialChain", "RevocationStatusUnknown", "OfflineRevocation")
          $fatal = @($chain.ChainStatus | Where-Object { $tolerated -notcontains $_.Status.ToString() })
          if ($fatal.Count -gt 0) {
            $chainErrors = ($fatal | ForEach-Object { "$($_.Status): $($_.StatusInformation.Trim())" }) -join "; "
            throw "Windows code-signing certificate chain validation failed: $chainErrors"
          }
          if (-not $built) {
            Write-Host "::warning::certificate chain is not publicly trusted ($(($chain.ChainStatus | ForEach-Object { $_.Status.ToString() }) -join ', ')). The binary is signed and tamper-evident, but Windows will still warn that the publisher is unknown until an OV/EV certificate replaces this one."
          }
          "WIN_CSC_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Sign and verify
        shell: pwsh
        env:
          WIN_CSC_CERTIFICATE_THUMBPRINT: ${{ env.WIN_CSC_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "stage/bin/Redrob Canvas.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Built executable not found at $exe" }
          $certificate = Get-Item "Cert:\CurrentUser\My\$env:WIN_CSC_CERTIFICATE_THUMBPRINT"

          # Set-AuthenticodeSignature is built into PowerShell, so this does not depend on
          # locating signtool.exe inside whichever Windows SDK the image happens to carry.
          Set-AuthenticodeSignature -FilePath $exe -Certificate $certificate `
            -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          # A self-signed signer makes Get-AuthenticodeSignature report NotTrusted or
          # UnknownError rather than Valid, on a runner that does not carry our root. Those two
          # are accepted; HashMismatch and NotSigned are not, so an unsigned or modified
          # executable still fails here. The signer thumbprint and the countersignature are
          # asserted unconditionally -- those say it is OUR certificate and that the signing
          # time is attested, neither of which depends on the root being trusted.
          $accepted = @("Valid", "NotTrusted", "UnknownError")
          if ($accepted -notcontains $signature.Status.ToString()) {
            throw "Executable signature is not usable: $($signature.Status) ($($signature.StatusMessage))"
          }
          if (-not $signature.SignerCertificate) {
            throw "Executable carries no Authenticode signer certificate"
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:WIN_CSC_CERTIFICATE_THUMBPRINT) {
            throw "Executable was signed by an unexpected certificate"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Executable signature carries no trusted timestamp"
          }
          Write-Host "signed by $($signature.SignerCertificate.Subject) status=$($signature.Status)"

      - name: Package
        shell: bash
        env:
          BASE: ${{ steps.unpack.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          powershell -NoProfile -Command \
            "Compress-Archive -Path '$RUNNER_TEMP/stage/*' -DestinationPath '$RUNNER_TEMP/artifacts/${BASE}.zip' -Force"

      - name: Replace the unsigned build on the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.unpack.outputs.base }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts"
          ( cd "$out" && shasum -a 256 ./* > "${BASE}-SHA256SUMS.txt" 2>/dev/null \
            || sha256sum ./* > "${BASE}-SHA256SUMS.txt" )
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "$out"/*
          gh release delete-asset "$RELEASE_TAG" "${BASE}.unsigned.zip" -R "$GITHUB_REPOSITORY" --yes

  verify-release-assets:
    name: Signed builds and GPL source accompany the release
    needs: [validate, sign-macos, sign-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # write, not read, for a job that only reads: GitHub lists DRAFT releases solely to a
      # caller with push access, and this job's whole purpose is to inspect the draft.
      contents: write
    steps:
      # Shipping a GPL binary without its corresponding source is a licence violation, not
      # an oversight to fix later, and a missing platform is a release that silently ships
      # less than its notes claim. Both fail here rather than appearing on a checklist
      # someone reads after publishing.
      - name: Assert every platform and every licence artifact is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REQUIRED_ARCHIVES: ${{ needs.validate.outputs.archive_suffixes }}
        shell: bash
        run: |
          set -euo pipefail
          # A DRAFT release is NOT on the tags endpoint: GET /releases/tags/<tag> answers 404
          # until publication, because a draft has no published tag to resolve. Since this job
          # exists to inspect the draft, it has to find it in the listing, which does include
          # drafts for a caller with push access.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          release_json="$(jq --arg tag "${RELEASE_TAG}" 'map(select(.tag_name == $tag)) | first // empty' "$RUNNER_TEMP/releases.json")"
          if [ -z "$release_json" ]; then
            echo "::error::No release found for ${RELEASE_TAG}. A draft is only listed to a caller with push access, so check this job's contents permission if the draft does exist."
            exit 1
          fi

          if [ "$(printf '%s' "$release_json" | jq -r '.draft')" != "true" ]; then
            echo "::error::Release ${RELEASE_TAG} must still be a draft when the build finishes"
            exit 1
          fi

          names="$(printf '%s' "$release_json" | jq -r '.assets[].name')"
          echo "Assets on ${RELEASE_TAG}:"
          printf '  %s\n' $names

          # Platform archives come from the same generator that built the matrix, so a leg that
          # was deliberately not built is not demanded here, and one that WAS built cannot be
          # quietly missing. Glob matching, since the list crosses a job output boundary where
          # regex escaping is easy to get silently wrong.
          for suffix in ${REQUIRED_ARCHIVES}; do
            found=0
            for name in $names; do
              case "$name" in
                *"$suffix") found=1; break ;;
              esac
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::no asset ending in ${suffix}; a platform this run built produced no archive"
              exit 1
            fi
          done

          # The licence artifacts are unconditional: they do not depend on which platforms were
          # built, and shipping a GPL binary without its corresponding source is a violation.
          for pattern in \
            'corresponding-source\.tar\.gz$' \
            '^SOURCE_OFFER\.md$' \
            '^THIRD_PARTY_NOTICES\.md$' \
            '^LICENSE$' \
            '^COPYRIGHT$' \
            'SHA256SUMS\.txt$'; do
            if ! printf '%s\n' $names | grep -qE "$pattern"; then
              echo "::error::no asset matching ${pattern}; the GPL obligation requires the corresponding source, offer, notices and licence alongside every binary"
              exit 1
            fi
          done

          # The builds arrive unsigned and the signing jobs replace them. One still attached means a
          # signing job uploaded its result and then failed to remove the input, and a user could
          # download the unsigned copy, so it fails here.
          if printf '%s\n' $names | grep -q '\.unsigned\.'; then
            echo "::error::an unsigned archive is still attached to the draft"
            exit 1
          fi

          echo "Every built platform archive (${REQUIRED_ARCHIVES}), the corresponding source, the source offer, notices, licence and checksums are attached."
