name: Release

# The ONE release path: every platform is built on GitHub runners from the single cargo binary
# `redrob-canvas` (apps/redrob-canvas), Windows is signed through Azure Artifact Signing with the
# job's OpenID Connect login, macOS is signed and notarized with the organization's Developer ID,
# and the shared redrob-labs publish job creates the GitHub Release.
#
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z           # the release: PUBLISHED as latest
#   gh workflow run release.yml --ref <branch> -f dry_run=true     # builds and signs; publishes nothing
#
# The parts every redrob-labs repository shares are not in this file; they are called:
#   - redrob-labs/.github/actions/sign-windows                     Authenticode through Azure Artifact Signing
#   - redrob-labs/.github/.github/workflows/release-publish.yml    checksums, launcher manifest, release
#
# Rules this file encodes:
#   - Windows: build, THEN `azure/login` (OIDC), THEN sign -- the login token is short-lived and the
#     build is long; there is no certificate file and no client secret anywhere. The executable is
#     signed BEFORE it is zipped and before the setup embeds that zip; the uninstaller and the setup
#     are signed in their turn. `release` is the environment the organization's federated credential
#     names; any other name is refused.
#   - validate is the repository scripts plus `cargo fmt --check`; clippy and the tests ran on the
#     pull request (.github/workflows/ci.yml) and are not repeated here;
#   - the publish job runs only for a real tag, and only when every job before it succeeded;
#   - the release is published as latest unless the version carries a pre-release suffix.
#
# There is no Qt, no CMake and no aqtinstall here any more: 0.7.0 replaced the Qt Quick shell with an
# egui shell, so a leg is `cargo build --release -p redrob-canvas --target <triple>` and a packaging
# script. The Linux leg needs the X11/Wayland/GL development headers egui, wgpu and rfd link against.
#
# Exactly THREE targets (tools/release_matrix.py is the list):
#   macOS arm64        redrob-canvas-<v>-macos-arm64.zip + .dmg          (Developer ID, notarized, stapled)
#   Linux x86_64       redrob-canvas-<v>-linux-x86_64.tar.gz + .deb
#   Windows x64        redrob-canvas-<v>-windows-x64-portable.zip + -setup.exe   (Azure Artifact Signing)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, vMAJOR.MINOR.PATCH, already pushed and on main (empty for a dry run)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run: build and sign the dispatched ref, publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag != '' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PRODUCT: Redrob Canvas
  PRODUCT_URL: https://github.com/${{ github.repository }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      # The version without the leading v, the commit every later job builds, and whether this is a
      # dry run. For a tag the commit is the tag's; for a dry run it is the dispatched ref's.
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      # The build matrix, the platform assets the release must carry, and the platform list the
      # release notes promise -- all from the single list in tools/release_matrix.py.
      matrix: ${{ steps.release-matrix.outputs.matrix }}
      archive_suffixes: ${{ steps.release-matrix.outputs.archive_suffixes }}
      installer_suffixes: ${{ steps.release-matrix.outputs.installer_suffixes }}
      notes_platforms: ${{ steps.release-matrix.outputs.notes_platforms }}
      windows_signing_ready: ${{ steps.release-matrix.outputs.windows_signing_ready }}
    steps:
      # A dry run builds whatever was dispatched; a release builds the tag it names. Resolved
      # before the checkout so the checkout can take the result.
      - name: Resolve what to build
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run of $GITHUB_REF_NAME ($GITHUB_SHA): builds and signs, publishes nothing"
          elif [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::not a release tag: $INPUT_TAG"; exit 1; }
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::give a tag (the release) or set dry_run (a rehearsal); neither was given"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      # Decides which platforms this release builds. Windows is omitted, with a notice in the
      # run log, until the repository variable WINDOWS_SIGNING_READY is "true" -- see the
      # script for why an unsigned Windows executable is not the fallback.
      - name: Resolve the release matrix
        id: release-matrix
        env:
          WINDOWS_SIGNING_READY: ${{ vars.WINDOWS_SIGNING_READY }}
        run: python3 tools/release_matrix.py

      # The packaging step derives the version from the TAG, while the binary reports the one in
      # Cargo.toml. Nothing made the two agree, so a tag could ship archives named one version
      # holding a binary that calls itself another. Checked here, before anything is built.
      # A dry run has no tag: it takes the crate version as it is and skips the tag checks.
      - name: Require the tag on main, matching the workspace version and the changelog
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          test -n "$crate_version"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "version=${crate_version}" >> "$GITHUB_OUTPUT"
            echo "dry run: building Cargo.toml version ${crate_version} at $(git rev-parse --short HEAD)"
            exit 0
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main"
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag v${tag_version} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi
          # The release notes say "See CHANGELOG", so a release whose version has no entry there
          # ships notes that describe nothing.
          if ! grep -q "^## ${tag_version} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${tag_version}' section"
            exit 1
          fi
          if grep -q "^## ${tag_version} - unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still marks ${tag_version} as unreleased"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      # The repository scripts, as the CI `checks` job runs them: pins, upstream identifiers, the
      # generated notices (an attribution defect blocks the release rather than being corrected
      # afterwards) and the design system.
      - name: Upstream pins and identifiers
        run: |
          ./scripts/verify-upstream.sh
          python3 scripts/check_upstream_ids.py

      - name: Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      # The generator reads Cargo metadata offline on purpose; populate the cache first.
      - name: Check the generated third-party notices
        run: |
          cargo fetch --locked
          python3 tools/generate_distribution_artifacts.py --check

      - name: Design system tokens and mark are current
        run: python3 tools/check_design_system.py

      - name: Formatting
        run: |
          # clippy and the tests already gated the commit on its pull request (ci.yml); a release
          # re-running them cost 14 minutes per dispatch for no new information.
          cargo fmt --all -- --check

  build:
    name: Build ${{ matrix.label }}
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs/<repo>:environment:release); any other name is refused by Azure.
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential (Windows leg).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Generated by tools/release_matrix.py in the validate job, so the Windows leg can be
        # excluded while Authenticode signing is not configured, and so the asset names the
        # verify job demands and the platform list the release notes promise come from that
        # same single list.
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      # Plain IDs (not credentials); here so the login step can be skipped when signing is not set up.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.slug }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev dpkg-dev

      # macOS: import the Developer ID certificate into a throwaway keychain and read the
      # identity back out, rather than assuming its name.
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redrob-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/redrob-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/redrob-build.keychain"
          security import "$RUNNER_TEMP/redrob-certificate.p12" -k "$RUNNER_TEMP/redrob-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/redrob-build.keychain" | awk -F'"' 'NR==1 {print $2}')"
          test -n "$CERT_ID"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/redrob-certificate.p12"

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_API_KEY_ID APPLE_NOTARY_API_ISSUER_ID; do
            test -n "${!name:-}"
          done
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --release --locked -p redrob-canvas --target "$TARGET"

      # Only the shell binary and the four editors' crates are built per platform; the workspace
      # tests already ran on Linux in validate. Here the binary has to at least answer --version,
      # which proves it links and starts without a display.
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/redrob-canvas"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          test -x "$bin"
          "$bin" --version

      # One staging tree per platform: bin/<binary> and the licence set. The licences travel with
      # every archive (MIT asks the notice to be retained in every copy; Apache 4(d) the NOTICE).
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          python3 tools/release/stage.py --target "$TARGET" --version "$VERSION" --out "$stage"
          ls -R "$stage" | head -50

      # The version Finder, the About box and Gatekeeper show is read from the bundle after it is
      # built, not trusted from the script that wrote it.
      - name: Require the bundle version to match the workspace version (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          plist="$RUNNER_TEMP/stage/Redrob Canvas.app/Contents/Info.plist"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          for key in CFBundleShortVersionString CFBundleVersion; do
            bundle_version="$(plutil -extract "$key" raw -o - "$plist")"
            if [ "$bundle_version" != "$crate_version" ]; then
              echo "::error::Info.plist $key is $bundle_version, Cargo.toml is $crate_version"
              exit 1
            fi
          done

      - name: Sign, notarize and staple (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/stage/Redrob Canvas.app"

          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # notarytool takes an archive, not a bundle; ditto --keepParent preserves the
          # .app directory structure that a plain zip mangles.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
            --wait

          # Stapling and validating both look the ticket up in Apple's CloudKit service, and that
          # lookup drops ("The network connection was lost", error 68) after notarization was
          # Accepted. Each network step is retried with backoff; a real refusal fails every attempt.
          retry() {
            local i
            for i in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              [ "$i" -lt 6 ] || { echo "::error::failed after 6 attempts: $*"; return 1; }
              echo "::warning::attempt $i of 6 failed: $*; retrying in $((i * 20))s"
              sleep $((i * 20))
            done
          }
          retry xcrun stapler staple "$app"
          retry xcrun stapler validate "$app"
          # Gatekeeper's own verdict, which is what a user's machine actually applies.
          retry spctl --assess --type execute --verbose=4 "$app"
          rm -f "$RUNNER_TEMP/notarize.zip"

      # The login comes after the build on purpose: the OpenID Connect token is short-lived and a
      # long build left signtool without a usable credential (it then waited on a browser).
      - name: Log in to Azure (OIDC)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The executable is signed BEFORE it is zipped: the portable zip and the setup both carry it
      # as is.
      - name: Sign the executable (Windows)
        if: runner.os == 'Windows'
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: ${{ runner.temp }}/stage/bin/redrob-canvas.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts"
          mkdir -p "$out"
          base="redrob-canvas-${VERSION}-${{ matrix.slug }}"

          case "$RUNNER_OS" in
            macOS)
              # Archive the whole staging tree, not just the .app, so the licences and notices
              # travel with the binary. ditto (not zip/cp) because it preserves the code
              # signature's extended attributes and the stapled notarization ticket.
              mv "$RUNNER_TEMP/stage" "$RUNNER_TEMP/${base}"
              ( cd "$RUNNER_TEMP" && ditto -c -k --sequesterRsrc --keepParent "$base" "$out/${base}.zip" )
              ;;
            Windows)
              # `-portable`: the unpacked, signed app, which Redrob Launcher unzips and runs in place.
              powershell -NoProfile -Command \
                "Compress-Archive -Path '$RUNNER_TEMP/stage/*' -DestinationPath '$out/${base}-portable.zip' -Force"
              ;;
            *)
              tar -C "$RUNNER_TEMP/stage" -czf "$out/${base}.tar.gz" .
              # The same tree as a package for apt; the system's own uninstall removes it.
              python3 tools/release/make_deb.py "$RUNNER_TEMP/stage" "$VERSION" "$out/${base}.deb"
              # The licence set once, from Linux, rather than three times under the same name.
              cp LICENSE-MIT LICENSE-APACHE COPYRIGHT NOTICE THIRD_PARTY_NOTICES.md "$out/"
              ;;
          esac

          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'dir=%s\n' "$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      # The disk image most people download: the stapled app, an Applications link, the uninstaller
      # and the licences, on the branded window (installer/macos/). The image is signed, notarized and
      # stapled in its own right, so Gatekeeper accepts it before anyone opens the app inside.
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          BASE: ${{ steps.package.outputs.base }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          # A venv: the runner's Homebrew Python is "externally managed" (PEP 668) and refuses
          # `pip install --user`.
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install --quiet "dmgbuild==1.6.5"
          export PATH="$RUNNER_TEMP/dmgbuild-venv/bin:$PATH"  # make-dmg.sh runs `python3 -m dmgbuild`
          dmg="$RUNNER_TEMP/artifacts/${BASE}.dmg"
          bash installer/macos/make-dmg.sh \
            --app "$RUNNER_TEMP/$BASE/Redrob Canvas.app" \
            --licenses "$RUNNER_TEMP/$BASE/share/redrob-canvas/licenses" \
            --version "$VERSION" --sign-identity "$APPLE_SIGNING_IDENTITY" --out "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
            --wait
          # The same retry as the app's staple, above (each step is its own shell).
          retry() {
            local i
            for i in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              [ "$i" -lt 6 ] || { echo "::error::failed after 6 attempts: $*"; return 1; }
              echo "::warning::attempt $i of 6 failed: $*; retrying in $((i * 20))s"
              sleep $((i * 20))
            done
          }
          retry xcrun stapler staple "$dmg"
          retry xcrun stapler validate "$dmg"
          retry spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      # The setup carries the signed zip above and the uninstaller, so it is built after signing:
      # uninstaller first, signed, then embedded; the setup last, signed. installer/windows/README.md.
      - name: Build the uninstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "setup"
          python installer/windows/build.py --out $work --version $env:VERSION --uninstaller-only
          if ($LASTEXITCODE -ne 0) { throw "uninstaller build failed ($LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath (Join-Path $work "uninstall/Uninstall Redrob Canvas.exe"))) {
            throw "uninstaller was not built"
          }

      - name: Sign the uninstaller (Windows)
        if: runner.os == 'Windows'
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: ${{ runner.temp }}/setup/uninstall/*.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - name: Build the setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BASE: ${{ steps.package.outputs.base }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "setup"
          $zip = Join-Path $env:RUNNER_TEMP "artifacts/$env:BASE-portable.zip"
          $setupName = "$env:BASE-setup.exe"
          $uninstaller = Join-Path $work "uninstall/Uninstall Redrob Canvas.exe"
          python installer/windows/build.py --out $work --version $env:VERSION --payload $zip `
            --uninstaller $uninstaller --name $setupName
          if ($LASTEXITCODE -ne 0) { throw "setup build failed ($LASTEXITCODE)" }
          $setup = Join-Path $work $setupName
          # The setup must carry exactly the zip that ships beside it; a stale payload would install
          # a different build than the one its checksum file describes.
          if ((Get-Item -LiteralPath $setup).Length -le (Get-Item -LiteralPath $zip).Length) {
            throw "setup is not larger than the zip it should embed"
          }
          Copy-Item -LiteralPath $setup -Destination (Join-Path $env:RUNNER_TEMP "artifacts/$setupName")

      - name: Sign the setup (Windows)
        if: runner.os == 'Windows'
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: ${{ runner.temp }}/artifacts/*-setup.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      # `release-*` is the prefix the shared publish job collects; the checksums and the launcher
      # manifest are written there, over every platform's files at once.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: ${{ steps.package.outputs.dir }}/*
          if-no-files-found: error

      - name: Remove the temporary keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/redrob-build.keychain" ]; then security delete-keychain "$RUNNER_TEMP/redrob-build.keychain" || true; fi

  verify-release-assets:
    name: Signed builds and licence files accompany the release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A missing platform is a release that silently ships less than its notes claim, and a
      # binary without its licence texts breaks the one thing MIT and Apache ask for. Both fail
      # here, BEFORE the release is published.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Assert every platform and every licence artifact is present
        env:
          REQUIRED_ARCHIVES: ${{ needs.validate.outputs.archive_suffixes }} ${{ needs.validate.outputs.installer_suffixes }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(ls -1 artifacts)"
          echo "Assets built:"
          printf '  %s\n' $names

          # Platform archives and installers come from the same generator that built the matrix,
          # so a leg that was deliberately not built is not demanded here, and one that WAS built
          # cannot be quietly missing.
          for suffix in ${REQUIRED_ARCHIVES}; do
            found=0
            for name in $names; do
              case "$name" in
                *"$suffix") found=1; break ;;
              esac
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::no asset ending in ${suffix}; a platform this run built produced no archive"
              exit 1
            fi
          done

          # The licence artifacts are unconditional. The checksums and redrob-launcher.json are
          # the publish job's: it writes both over this same set of files.
          for pattern in \
            '^LICENSE-MIT$' \
            '^LICENSE-APACHE$' \
            '^COPYRIGHT$' \
            '^NOTICE$' \
            '^THIRD_PARTY_NOTICES\.md$'; do
            if ! printf '%s\n' $names | grep -qE "$pattern"; then
              echo "::error::no asset matching ${pattern}; the licence texts and notices must accompany every binary"
              exit 1
            fi
          done

          if printf '%s\n' $names | grep -q '\.unsigned\.'; then
            echo "::error::an unsigned archive is among the assets"
            exit 1
          fi

          echo "Every built platform asset (${REQUIRED_ARCHIVES}) and the licence files are present."

  # The shared redrob-labs publish job: SHA256SUMS.txt over every asset, redrob-launcher.json (this
  # app reads the launcher's shared sign-in through the engine), and the release v<version> created
  # and PUBLISHED as latest (prerelease when the version carries a `-`). Only for a real tag, never
  # for a dry run, and only when every job before it succeeded. `tag` and `target` are passed
  # explicitly because this workflow is dispatched from a branch: github.sha is the branch head, not
  # the tag's commit. The assets reach it as the `release-*` artifacts every job above uploaded
  # (release-linux-x86_64, release-macos-arm64, release-windows-x64), which the shared
  # job merges into one directory before writing the sums -- the same hand-over redrob-shape uses.
  publish:
    needs: [validate, build, verify-release-assets]
    if: always() && needs.validate.outputs.dry_run != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.validate.outputs.version }}
      title: Redrob Canvas
      launcher_manifest: true
      publish: true
      tag: ${{ inputs.tag }}
      target: ${{ needs.validate.outputs.sha }}
