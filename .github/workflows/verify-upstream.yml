name: verify upstream

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Upstream pins are well-formed and reachable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      # Deliberately does NOT fetch the 753 MB of upstream trees. It checks that the pins are
      # well-formed, that upstream/ cannot be committed, and that both remotes are reachable.
      - name: Verify the upstream pins
        run: ./scripts/verify-upstream.sh

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      # The core is Qt-independent by design, so it tests without Qt, without the upstream trees,
      # and without a display. This repository had no CI at all before now.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test the workspace
        run: cargo test --workspace --locked

  distribution:
    name: Distribution artifacts are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      # The generator reads `cargo metadata --locked --offline` on purpose, and
      # THIRD_PARTY_NOTICES.md asserts that no network content went into it. On a
      # cold runner the registry index is empty, so that read fails outright
      # ("no matching package named font8x8"). Populate the cache first and leave
      # the generator offline rather than weakening the compliance property.
      - name: Populate the Cargo registry cache
        run: cargo fetch --locked

      # THIRD_PARTY_NOTICES.md and SOURCE_OFFER.md are generated, and a stale pair is a GPL
      # compliance defect rather than a cosmetic one. The default build enables neither seam.
      - name: Check the generated notices and source offer
        run: python3 tools/generate_distribution_artifacts.py --check --gegl OFF --krita OFF

  # The sibling products already gate on this; canvas did not, which mattered once Dependabot
  # version-update pull requests were turned off. Dependabot security updates still open a pull
  # request for a known-vulnerable dependency, but that is a notification after the fact -- this
  # job refuses to let one in, which is the control that actually holds the line.
  advisories:
    name: Rust security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Rust for security audit
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked

      # The advisory database changes daily, so this can go red on a branch that changed no
      # dependencies. When it is a real finding, bump the crate rather than allowing it.
      - name: Audit locked Rust dependencies
        run: cargo +stable audit --file Cargo.lock
