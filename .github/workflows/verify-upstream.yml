# The gate every pull request into develop and main must pass. Four jobs, each the same command a
# contributor runs locally: the upstream pins, the Rust workspace, the generated notices plus the
# design-system guard, and the advisory audit. None needs a display, Qt or a native toolchain beyond
# the X11/Wayland/GL headers egui, wgpu and rfd link against.
name: verify upstream

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  pins:
    name: Upstream pins are well-formed and reachable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          # The script reads each subtree's squash commit out of git log.
          fetch-depth: 0

      # Reads upstream-base.json, docs/upstream-sources.toml and UPSTREAM_NOTICES.md against each
      # other and against the subtree squash commits, then asks GitHub whether each pinned commit
      # still exists. It fetches no upstream tree.
      - name: Verify the upstream pins
        run: ./scripts/verify-upstream.sh

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      # The toolchain is the one rust-toolchain.toml pins; the action installs that channel rather
      # than whatever `stable` is on the runner image the day the job runs.
      - name: Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: System libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # Upstream subtrees under crafts/ are linted by their own projects; we gate only our crates.
        run: cargo clippy -p redrob-canvas -p redrob-ai -p redrob-agent --all-targets --locked --profile ci -- -D warnings

      - name: Test our crates
        # The upstream subtrees are tested by their own projects; linking every one of the
        # ~75 crates' test binaries exhausted the hosted runner's disk (ld died with SIGBUS).
        run: cargo test -p redrob-canvas -p redrob-ai -p redrob-agent --locked --profile ci

  distribution:
    name: Distribution artifacts are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      # The generator reads `cargo metadata --locked --offline` on purpose, and the notice file
      # asserts that no network content went into it. On a cold runner the registry index is
      # empty, so that read fails outright. Populate the cache first and leave the generator
      # offline rather than weakening the property.
      - name: Populate the Cargo registry cache
        run: cargo fetch --locked

      # THIRD_PARTY_NOTICES.md is generated, and a stale one is an attribution defect.
      - name: Check the generated third-party notices
        run: python3 tools/generate_distribution_artifacts.py --check

      # The design-system guard: pinned tokens and icons, the brand assets against brand/SOURCES.json
      # (scripts/check-brand.py), no stray mark under resources/, no colour literal in the shell's chrome.
      - name: Design system tokens and mark are current
        run: python3 tools/check_design_system.py

      # The tools' own tests, including the guard's reverse verification: each defect is put back
      # and the guard must fail on it. A guard nobody has seen fail is a guard nobody has tested.
      - name: Run the tool tests
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"

  # The sibling products gate on this too. Dependabot security updates still open a pull request
  # for a known-vulnerable dependency, but that is a notification after the fact; this job refuses
  # to let one in.
  advisories:
    name: Rust security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Rust for security audit
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked

      # The advisory database changes daily, so this can go red on a branch that changed no
      # dependencies. When it is a real finding, bump the crate rather than allowing it.
      - name: Audit locked Rust dependencies
        run: cargo +stable audit --file Cargo.lock
