# Gitflow rules shared by every redrob-labs repository: branch names are <type>/<slug> from the
# org-wide type list, and main is contained in develop (a back-merge pull request is opened when
# it is not). The rules live in redrob-labs/.github/.github/workflows/gitflow.yml; this file only
# calls them. Do not add a type list here -- there is one, and it is there.

name: gitflow

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gitflow:
    uses: redrob-labs/.github/.github/workflows/gitflow.yml@main
