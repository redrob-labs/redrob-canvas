[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }
unsafe_code = "forbid"

[workspace.lints.clippy]
collapsible_match = "allow"
dbg_macro = "warn"
expect_used = "deny"
nonminimal_bool = "allow"
panic = "deny"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[patch.crates-io]
krilla = { path = "crafts/craft-libs/vendor/krilla" }
hayro = { path = "crafts/craft-libs/vendor/hayro" }
hayro-interpret = { path = "crafts/craft-libs/vendor/hayro-interpret" }
hayro-syntax = { path = "crafts/craft-libs/vendor/hayro-syntax" }
hayro-jbig2 = { path = "crafts/craft-libs/vendor/hayro-jbig2" }
# designcraft pins a winit fork for a fix not yet upstream; one patch applies to the tree.
winit = { git = "https://github.com/skylartaylor/winit.git", rev = "3d51077fd1a966f84df9ef287839dc84fd5b4ca7" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# CI gates compile with `--profile ci`: no optimisation anywhere (the dev profile optimises every
# dependency at level 2, which is what makes a cold `cargo test` take a quarter of an hour).
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
