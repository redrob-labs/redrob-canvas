regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
# `rustls-tls` bundles the webpki roots; `rustls-tls-native-roots` adds the OS store, so a corporate
# TLS-inspecting proxy's root (installed on Windows, not in webpki) still verifies; `system-proxy`
# reads the OS proxy settings (the Windows registry, macOS SystemConfiguration, `HTTPS_PROXY`),
# which `default-features = false` had switched off.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "system-proxy", "stream"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
rfd = "0.17"
rustix = { version = "1.1", default-features = false }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
skrifa = "0.47"
socket2 = "0.6"
tempfile = "3"
thiserror = "2"
tiff = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
unicode-script = "0.5"
unicode-segmentation = "1"
usvg = "0.48"
vello_common = { version = "0.2", default-features = false }
vello_cpu = { version = "0.2", features = ["f32_pipeline"] }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
wat = "1.228"
webbrowser = "1"
wiremock = "0.6"
zip = { version = "3", default-features = false, features = ["deflate"] }
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }
unsafe_code = "forbid"

[workspace.lints.clippy]
collapsible_match = "allow"
dbg_macro = "warn"
expect_used = "deny"
nonminimal_bool = "allow"
panic = "deny"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[patch.crates-io]
krilla = { path = "crafts/craft-libs/vendor/krilla" }
hayro = { path = "crafts/craft-libs/vendor/hayro" }
hayro-interpret = { path = "crafts/craft-libs/vendor/hayro-interpret" }
hayro-syntax = { path = "crafts/craft-libs/vendor/hayro-syntax" }
hayro-jbig2 = { path = "crafts/craft-libs/vendor/hayro-jbig2" }
# designcraft pins a winit fork for a fix not yet upstream; one patch applies to the tree.
winit = { git = "https://github.com/skylartaylor/winit.git", rev = "3d51077fd1a966f84df9ef287839dc84fd5b4ca7" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# CI gates compile with `--profile ci`: no optimisation anywhere (the dev profile optimises every
# dependency at level 2, which is what makes a cold `cargo test` take a quarter of an hour).
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
