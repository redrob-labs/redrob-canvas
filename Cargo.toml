# GENERATED by tools/merge_workspaces.py from crafts/*/Cargo.toml -- edit that script,
# not this file. Re-run it after every `git subtree pull`.

[workspace]
resolver = "3"
members = [
  "crates/*",
  "apps/*",
  "crafts/photocraft/crates/*",
  "crafts/vectorcraft/crates/*",
  "crafts/designcraft/crates/*",
  "crafts/craft-libs/crates/*",
]
# Upstream binaries, xtasks and web shells are not built here; the Redrob Canvas shell in
# apps/ hosts the three editors as modes. craft-libs vendors krilla/hayro, patched below.
exclude = [
  "crafts/photocraft/apps",
  "crafts/photocraft/xtask",
  "crafts/vectorcraft/apps",
  "crafts/vectorcraft/xtask",
  "crafts/designcraft/apps",
  "crafts/designcraft/xtask",
  "crafts/craft-libs/vendor",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/redrob-labs/redrob-canvas"

[workspace.dependencies]
arboard = { version = "3.6", default-features = false }
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
caseless = "0.2"
