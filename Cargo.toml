[workspace]
resolver = "3"
members = [
  "crates/redrob-core",
  "crates/redrob-agent",
  "crates/redrob-ffi",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"
repository = "https://github.com/redrob-labs/redrob-canvas"

[workspace.dependencies]
# Ported Graphite geometry (crates/redrob-core/src/geometry) is written against these two.
# kurbo owns the curve maths and glam the vector algebra; see geometry/convert.rs for why both.
glam = "0.30"
# 0.13 because that is what Graphite pins and the ported geometry is written against its
# API -- kurbo::offset::offset_cubic does not exist in 0.11, which a guessed version found
# out at compile time.
kurbo = { version = "0.13", features = ["serde"] }
# intersection.rs takes its analytical cubic-cubic fast path from lyon_geom, converting
# kurbo segments across. Graphite pins the same major version.
lyon_geom = "1.0"
# bezpath_algorithms.rs finds polynomial roots with this; Graphite pins the same major.
polycool = "0.4"
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "tga", "pnm", "ico", "qoi", "jpeg", "png", "webp", "tiff", "exr", "dds", "gif"] }
icns = "0.5.0"
hayro-jpeg2000 = "0.3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font8x8 = "=0.3.1"
# H7: outline fonts, resolved by name. Parsing only; the outlines are filled by our own path filler.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
# L13: OpenType shaping (GSUB ligatures and contextual forms, GPOS kerning and marks) for outline
# text. Pure Rust, MIT, built on the same ttf-parser.
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }
# L5: profiled CMYK (soft proof, separations) through Little CMS. `static` builds the bundled
# Little CMS into the library, so the Rust staticlib the Qt shell links carries it and no system
# liblcms2 is needed on any platform.
lcms2 = { version = "=6.2.0", features = ["static"] }
# Tests only: reads back the CMYK TIFF the engine writes (already in the tree through `image`).
tiff = { version = "=0.11.3", default-features = false }
quick-xml = "=0.41.0"
svgtypes = "=0.15.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
flate2 = "1"
# Pure-Rust JPEG XL decoder (H.13). Pinned to a minor line: a decoder is a parser facing
# untrusted input, so an unexpected major bump should be a deliberate upgrade.
jxl-oxide = { version = "0.12", default-features = false }
# Pure-Rust PDF object/stream parser (H.15). We use it to reach a page's image XObjects; the
# content-stream graphics interpreter is NOT part of this and is not attempted.
lopdf = "0.45"
# Pure-Rust camera-raw UNPACKER (H.16). It turns a vendor container into sensor samples plus the
# metadata needed to develop them; the development itself (levels, white balance, demosaic, colour
# matrix) is ours.
rawloader = "0.37"
